<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KPI Banking - NAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg0:#01050d;--bg1:#020a16;--bg2:#061525;--bg3:#0c2040;--gold:#e8a020;--gold2:#ffc84a;--blue:#1a6fff;--blue2:#4d9fff;--green:#00c48c;--red:#ff4757;--purple:#7c4dff;--cyan:#00d2ff;--text:#fff;--dim:#6a8aab;--mute:#2a4060;--border:#0e2a45;--border2:#1a3d5c;--card:#040e1e;--card2:#081830}
html,body{background:var(--bg0);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
button,input,select{font-family:inherit}
button{cursor:pointer}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg0);padding-bottom:82px}
.pad{padding:15px}
.hdr{position:sticky;top:0;z-index:100;padding:12px 16px 10px;background:rgba(1,5,13,.97);backdrop-filter:blur(20px);border-bottom:1px solid #0e2a4444}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo-ic{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.logo-tx{font-size:17px;font-weight:900;letter-spacing:-.04em;white-space:nowrap}
.logo-tx em{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-style:normal}
.sub{font-size:9px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hdr-sub{display:flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;border:1px solid}
.tag-g{background:#00c48c12;color:#00c48c;border-color:#00c48c25}.tag-y{background:#e8a02012;color:#ffc84a;border-color:#e8a02025}.tag-b{background:#1a6fff12;color:#4d9fff;border-color:#1a6fff25}.tag-m{background:#2a406012;color:#6a8aab;border-color:#2a406025}.tag-r{background:#ff475712;color:#ff6b7a;border-color:#ff475725}.tag-p{background:#7c4dff12;color:#a78bfa;border-color:#7c4dff25}
.m-sel,.dsel{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;color:#fff;font-weight:700;outline:none;appearance:none;-webkit-appearance:none}
.m-sel{padding:5px 8px;font-size:11px}.dsel{width:100%;padding:9px;font-size:12px;margin-bottom:9px}
.gold-btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#030810;border:none;border-radius:8px;padding:6px 10px;font-weight:900;font-size:11px;white-space:nowrap}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(1,5,13,.97);backdrop-filter:blur(20px);border-top:1px solid #0e2a4555;display:flex;z-index:100;padding:5px 0 7px}
.nb{flex:1;padding:6px 2px 4px;background:none;border:none;color:var(--mute);font-size:8.5px;font-weight:800;line-height:1.45;position:relative;text-transform:uppercase;letter-spacing:.03em}
.nb.on{color:var(--gold2)}.nb.on:after{content:"";position:absolute;top:0;left:20%;width:60%;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:0 0 2px 2px}
.nb-ic{font-size:17px;display:block;margin-bottom:2px}.nb-bdg{position:absolute;top:4px;right:calc(50% - 14px);background:var(--red);color:#fff;border-radius:50%;width:13px;height:13px;font-size:8px;font-weight:900;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bg0)}
.card,.ff,.chart-wrap{background:var(--card);border-radius:14px;padding:13px;border:1px solid var(--border);margin-bottom:10px}
.card-hi{background:linear-gradient(145deg,#0a1e3a,var(--bg1));border-color:var(--border2)}.card-gold{border-color:#e8a02030}.card-green{border-color:#00c48c30}.card-red{border-color:#ff475730}
.sec{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec:after{content:"";flex:1;height:1px;background:var(--border)}
.tt,.sb{display:flex;gap:5px;margin-bottom:13px}.sb{overflow-x:auto;scrollbar-width:none}.sb::-webkit-scrollbar{display:none}
.tb,.sbb{border:1px solid var(--border);background:var(--card2);color:var(--dim);font-weight:800;cursor:pointer;transition:.15s}
.tb{flex:1;padding:8px 0;border-radius:9px;font-size:13px}.sbb{padding:7px 12px;border-radius:18px;font-size:11px;white-space:nowrap;flex-shrink:0}
.tb.on{border-color:#1a6fff50;background:#1a6fff12;color:#4d9fff}.sbb.on{border-color:#e8a02050;background:#e8a02012;color:#ffc84a}
.nvi,.ri,.wi{background:var(--card);border-radius:13px;padding:11px 13px;margin-bottom:7px;border:1px solid var(--border);display:flex;align-items:center;gap:10px;width:100%;text-align:left;color:inherit}
.nvi:active,.ri:active{transform:scale(.985)}.nvi.hk{border-color:#e8a02028}.nvi.ht{border-color:#00c48c22}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.nv-n{font-weight:800;font-size:13px;color:#fff}.nv-s{font-size:11px;color:var(--dim);margin-top:2px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.chip{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:800;border:1px solid;white-space:nowrap}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}.kc{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--border);position:relative;overflow:hidden}.kc-bg{position:absolute;bottom:-8px;right:-4px;font-size:42px;opacity:.05;line-height:1}.kc-lbl{font-size:10px;color:var(--dim);margin-bottom:3px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.kc-val{font-size:18px;font-weight:900;line-height:1.1;font-family:"Space Mono",monospace}.kc-kh{font-size:9px;color:var(--mute);margin-top:2px}
.bw{background:#060e1a;border-radius:3px;overflow:hidden}.bf{border-radius:3px;transition:width .6s ease}
.fh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.fl{display:flex;align-items:center;gap:9px}.fn{font-weight:800;font-size:14px;color:#fff}.fk{font-size:10px;color:var(--dim);margin-top:2px}
input[type=number],input[type=text]{width:100%;background:var(--bg1);border:1px solid var(--border2);border-radius:9px;padding:11px 12px;color:#fff;font-size:15px;font-weight:700;outline:none;-webkit-appearance:none}input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}input:focus,select:focus{border-color:#1a6fff55}
.bsave,.bdanger{width:100%;border-radius:13px;cursor:pointer;font-weight:900;font-size:14px;margin-top:5px}.bsave{padding:13px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#030810}.bsave.ok{background:linear-gradient(135deg,#00c48c,#00ff9d)}.bdanger{padding:11px;border:1px solid #ff475730;background:#ff475710;color:#ff6b7a}
.bback{background:none;border:none;color:var(--dim);font-size:13px;padding:0;margin-bottom:15px;display:flex;align-items:center;gap:5px;font-weight:800}
.pin-overlay,.sheet-overlay{position:fixed;inset:0;background:rgba(1,5,13,.94);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(12px)}.sheet-overlay{align-items:flex-end;padding:0}
.pin-box{background:var(--card);border:1px solid var(--border2);border-radius:22px;padding:26px 20px;width:100%;max-width:290px;text-align:center}.pin-dots{display:flex;gap:12px;justify-content:center;margin:16px 0}.pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--border2)}.pin-dot.fill{background:var(--gold);border-color:var(--gold)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.pk{aspect-ratio:1;border-radius:12px;border:1px solid var(--border2);background:var(--card2);color:#fff;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sheet{background:#061525;border-radius:20px 20px 0 0;width:100%;max-width:430px;margin:0 auto;padding:0 0 22px;max-height:86vh;display:flex;flex-direction:column;border-top:1px solid #1a3d5c}.handle{width:34px;height:4px;border-radius:2px;background:#1a3d5c;margin:9px auto 0}.sheet-list{overflow:auto;flex:1;padding:7px 13px}
.nvp-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:12px;margin-bottom:5px;cursor:pointer;border:1px solid var(--border);background:var(--card)}.nvp-item.sel{border-color:#1a6fff50;background:#1a6fff10}.nvp-check{width:21px;height:21px;border-radius:6px;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px}.nvp-item.sel .nvp-check{background:#1a6fff;border-color:#1a6fff;color:#fff}
.pl-stage-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:10px;margin-bottom:6px}.pl-deal{background:var(--card);border-radius:11px;padding:11px 12px;margin-bottom:6px;border:1px solid var(--border);display:flex;align-items:center;gap:10px}.pl-actions{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}.pl-btn{padding:4px 9px;border-radius:6px;border:1px solid var(--border2);background:var(--card2);color:var(--dim);font-size:10px;font-weight:800}.pl-btn.adv{border-color:#00c48c30;background:#00c48c10;color:#00c48c}.pl-btn.del{border-color:#ff475728;background:#ff475710;color:#ff6b7a}
.star-card{border-radius:18px;padding:16px;margin-bottom:13px;background:linear-gradient(135deg,#1a1200,#0a1830);border:1px solid #e8a02032;position:relative;overflow:hidden}.sk{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.sk-i{background:#e8a02010;border:1px solid #e8a02022;border-radius:10px;padding:8px;text-align:center;flex:1;min-width:68px}
.ac{border-radius:13px;padding:12px;margin-bottom:10px;border-left:4px solid;background:var(--card)}.at{font-size:13px;font-weight:800;margin-bottom:6px}.ai{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #ffffff07;font-size:13px}
#loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px}.ld{width:32px;height:32px;border:3px solid #0e2a4560;border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.empty{text-align:center;padding:26px 15px;color:var(--mute);font-size:13px}
.error-box{margin:15px;padding:14px;border-radius:14px;border:1px solid #ff475730;background:#ff475710;color:#ffb3ba;font-size:12px;white-space:pre-wrap}
@media print{body{background:#fff;color:#111}#loading,#pin-modal,#nvp-modal,#exp-modal,.nav,.hdr{display:none!important}#app{max-width:none;padding:0;background:#fff;color:#111}}
</style>
</head>
<body>
<div id="loading">
  <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#e8a020,#ffc84a);display:flex;align-items:center;justify-content:center;font-size:22px">🏦</div>
  <div style="text-align:center">
    <div style="font-size:17px;font-weight:900;color:#fff">KPI <span style="background:linear-gradient(135deg,#e8a020,#ffc84a);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Banking</span></div>
    <div style="font-size:10px;color:var(--dim);letter-spacing:.07em;text-transform:uppercase;margin-top:3px">Nam A Bank · KHCN</div>
  </div>
  <div class="ld"></div>
</div>

<div id="pin-modal" class="pin-overlay">
  <div class="pin-box">
    <div style="font-size:22px;margin-bottom:5px">🔐</div>
    <div style="font-weight:800;font-size:15px;color:#fff">Xác thực Trưởng phòng</div>
    <div style="font-size:12px;color:var(--dim);margin-top:3px">Nhập mã PIN 4 số</div>
    <div class="pin-dots"><div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div><div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div></div>
    <div id="pin-err" style="color:var(--red);font-size:11px;margin-bottom:7px;min-height:15px"></div>
    <div class="pin-pad">
      <button class="pk" onclick="pinAdd(1)">1</button><button class="pk" onclick="pinAdd(2)">2</button><button class="pk" onclick="pinAdd(3)">3</button>
      <button class="pk" onclick="pinAdd(4)">4</button><button class="pk" onclick="pinAdd(5)">5</button><button class="pk" onclick="pinAdd(6)">6</button>
      <button class="pk" onclick="pinAdd(7)">7</button><button class="pk" onclick="pinAdd(8)">8</button><button class="pk" onclick="pinAdd(9)">9</button>
      <div></div><button class="pk" onclick="pinAdd(0)">0</button><button class="pk" style="font-size:16px;color:var(--dim)" onclick="pinDel()">⌫</button>
    </div>
    <button onclick="closePinModal()" style="margin-top:13px;background:none;border:none;color:var(--dim);font-size:12px;font-weight:700">✕ Hủy</button>
  </div>
</div>

<div id="nvp-modal" class="sheet-overlay" onclick="if(event.target===this)closeNVPicker()">
  <div class="sheet">
    <div class="handle"></div>
    <div style="padding:13px 16px 11px;border-bottom:1px solid #0e2a4444;flex-shrink:0">
      <div style="font-size:15px;font-weight:900;color:#fff;margin-bottom:3px">👥 Chọn nhân viên / nhóm</div>
      <div id="nvp-sub" style="font-size:11px;color:var(--dim)">Đang xem toàn phòng</div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <button onclick="nvpSelectAll()" class="sbb" style="flex:1;border-radius:8px">✓ Chọn tất</button>
        <button onclick="nvpClearAll()" class="sbb" style="flex:1;border-radius:8px">✕ Bỏ chọn</button>
        <button onclick="nvpSortScore()" class="sbb" style="flex:1;border-radius:8px">📊 Sắp xếp</button>
      </div>
    </div>
    <div class="sheet-list" id="nvp-list"></div>
    <div style="padding:11px 14px 0;flex-shrink:0"><button class="bsave" onclick="nvpConfirm()">Xem kết quả</button></div>
  </div>
</div>

<div id="exp-modal" class="sheet-overlay" onclick="if(event.target===this)closeExpModal()">
  <div class="sheet" style="max-height:none">
    <div class="handle"></div>
    <div style="padding:14px 16px 12px;border-bottom:1px solid #0e2a4444">
      <div style="font-size:15px;font-weight:900;color:#fff;margin-bottom:3px">📄 Xuất báo cáo PDF</div>
      <div style="font-size:11px;color:var(--dim)">In hoặc lưu PDF từ trình duyệt</div>
    </div>
    <div style="padding:13px 15px;display:flex;flex-direction:column;gap:8px">
      <button onclick="printReport('thang')" class="bsave" style="margin:0;text-align:left">📅 Báo cáo cả tháng</button>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button onclick="printReport('T1')" class="tb">T1</button><button onclick="printReport('T2')" class="tb">T2</button>
        <button onclick="printReport('T3')" class="tb">T3</button><button onclick="printReport('T4')" class="tb">T4</button>
      </div>
      <button onclick="closeExpModal()" class="bdanger" style="margin:0;background:none;color:var(--dim);border-color:var(--border2)">✕ Hủy</button>
    </div>
  </div>
</div>

<div id="app" style="display:none"></div>

<script>
"use strict";

const DB = "https://kpi-banking-nab-default-rtdb.asia-southeast1.firebasedatabase.app";
const ROOT = "kpi";
const PIN = "1234";
const FB_TIMEOUT = 4500;
const LS_KEY = "kpi_banking_nab_v4";

const NOW = new Date();
const CUR_M = `${NOW.getFullYear()}-${String(NOW.getMonth() + 1).padStart(2, "0")}`;
const CUR_T = NOW.getDate() <= 7 ? "T1" : NOW.getDate() <= 14 ? "T2" : NOW.getDate() <= 21 ? "T3" : "T4";

const NVS = [
  {ma:"10924", ten:"TRƯƠNG ANH TOÀN"},
  {ma:"16032", ten:"DƯƠNG HỒNG PHÁP"},
  {ma:"10847", ten:"TRẦN VIẾT DUY"},
  {ma:"10852", ten:"ĐỖ THỊ HỒNG SƯƠNG"},
  {ma:"13933", ten:"VÕ UYÊN BÌNH"},
  {ma:"15642", ten:"TRẦN CÔNG LUẬT"},
  {ma:"17339", ten:"PHẠM THỊ NGỌC HUYỀN"},
  {ma:"17489", ten:"NGUYỄN LÂM KHA"},
  {ma:"NV009", ten:"NGUYỄN THÀNH ĐẠT"},
  {ma:"NV010", ten:"ĐẶNG VÕ DUYÊN TRINH"},
  {ma:"NV011", ten:"LÊ THỊ BÍCH PHƯỢNG"},
  {ma:"NV012", ten:"NGUYỄN HỒNG PHƯƠNG THANH"}
];

const KPIS = [
  {key:"huy_dong", label:"Huy Động", short:"HD", icon:"💰", unit:"tr đ", star:true, color:"#e8a020"},
  {key:"du_no", label:"Dư Nợ", short:"DN", icon:"🏦", unit:"tr đ", star:true, color:"#1a6fff"},
  {key:"the_td", label:"Thẻ TD", short:"TT", icon:"💳", unit:"thẻ", star:true, color:"#7c4dff"},
  {key:"tk_hkd", label:"TK HKD", short:"HK", icon:"🏢", unit:"TK", star:false, color:"#00c48c"},
  {key:"qr_code", label:"QR Code", short:"QR", icon:"📱", unit:"QR", star:false, color:"#00d2ff"},
  {key:"cif", label:"CIF", short:"CF", icon:"👤", unit:"CIF", star:false, color:"#ff6b9d"}
];
const STARS = KPIS.filter(k => k.star);
const DEFAULT_KH = {huy_dong:47900, du_no:31000, the_td:82, tk_hkd:80, qr_code:220, cif:415};
const PL_STAGES = [
  {key:"tiep_can", label:"Tiếp cận", icon:"🟡", color:"#f59e0b"},
  {key:"tu_van", label:"Tư vấn", icon:"🔵", color:"#1a6fff"},
  {key:"de_xuat", label:"Đề xuất", icon:"🟠", color:"#f97316"},
  {key:"xu_ly", label:"Xử lý", icon:"🟣", color:"#7c4dff"},
  {key:"cho_duyet", label:"Chờ duyệt", icon:"⚪", color:"#94a3b8"},
  {key:"hoan_tat", label:"Hoàn tất", icon:"✅", color:"#00c48c"}
];

let pinBuf = "";
let pinAuth = false;
let pinCb = null;
let nvpSorted = false;

const S = {
  tab:"nhap", khTab:"phong", month:CUR_M, selT:CUR_T,
  selNV:null, detailNV:null, filterNVs:[], nvpTemp:[],
  scope:"thang", scopeDay:"", scopeFrom:"", scopeTo:"",
  plTab:"mine", plFormNV:null, plEditId:null,
  online:false, loadError:"",
  khPhong:{}, khTuan:{}, thTuan:{}, pipeline:{}
};

function escapeHtml(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
}
function safeAttr(v) { return escapeHtml(v); }
function fmt(v, u) {
  if (v == null || v === "") return "—";
  const n = Number(v);
  if (Number.isNaN(n)) return "—";
  return n.toLocaleString("vi-VN") + (u ? " " + u : "");
}
function pct(th, kh) { return kh > 0 && th != null ? Number(th || 0) / kh * 100 : null; }
function p2s(p) { return p == null || Number.isNaN(p) ? "—" : `${Math.round(p)}%`; }
function pc(p) {
  if (p == null || Number.isNaN(p)) return "#2a4060";
  if (p >= 100) return "#00c48c";
  if (p >= 70) return "#e8a020";
  if (p >= 40) return "#ff9f43";
  return "#ff4757";
}
function stl(p) {
  if (p == null || Number.isNaN(p)) return {l:"Chưa KH", c:"#2a4060"};
  if (p >= 100) return {l:"✅ Đạt", c:"#00c48c"};
  if (p >= 70) return {l:"⚡ Tốt", c:"#e8a020"};
  if (p >= 40) return {l:"⚠️ TB", c:"#ff9f43"};
  return {l:"🚨 Yếu", c:"#ff4757"};
}
function acC(ma) {
  const colors = ["#e8a020","#1a6fff","#7c4dff","#00c48c","#ff6b9d","#00d2ff","#ff9f43","#a855f7"];
  let h = 0;
  for (let i = 0; i < ma.length; i++) h = (h * 31 + ma.charCodeAt(i)) % colors.length;
  return colors[h];
}
function av(name, ma, sz = 36) {
  const c = acC(ma);
  const init = (String(name).trim().split(/\s+/).pop() || "?")[0];
  return `<div class="av" style="width:${sz}px;height:${sz}px;background:${c}18;border:1.5px solid ${c}42;color:${c};font-size:${Math.round(sz * .38)}px">${escapeHtml(init)}</div>`;
}
function chip(label, color) {
  return `<span class="chip" style="background:${color}18;color:${color};border-color:${color}30">${escapeHtml(label)}</span>`;
}
function bar(v, mx, col, h = 5) {
  const w = mx > 0 ? Math.min(100, Math.max(0, Number(v || 0) / mx * 100)) : 0;
  return `<div class="bw" style="height:${h}px"><div class="bf" style="width:${w}%;background:${col};height:${h}px"></div></div>`;
}
function ring(p, sz = 42, sw = 5) {
  const r = (sz - sw * 2) / 2;
  const c = 2 * Math.PI * r;
  const v = Math.min(Math.max(p || 0, 0), 100);
  return `<svg width="${sz}" height="${sz}" style="transform:rotate(-90deg)"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#060e1a" stroke-width="${sw}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${pc(p)}" stroke-width="${sw}" stroke-dasharray="${v/100*c} ${c}" stroke-linecap="round"/></svg>`;
}
function fmtTs(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return `${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function fmtM(m) { const [y, mo] = m.split("-"); return `T${Number(mo)}/${y}`; }
function genMonths() {
  const out = [];
  for (let y = 2026; y <= NOW.getFullYear(); y++) {
    const maxM = y === NOW.getFullYear() ? NOW.getMonth() + 1 : 12;
    for (let m = 1; m <= maxM; m++) out.push(`${y}-${String(m).padStart(2, "0")}`);
  }
  return out.reverse();
}
function genDays(m) {
  const [y, mo] = m.split("-").map(Number);

  return Array.from({length:days}, (_, i) => `${m}-${String(i + 1).padStart(2, "0")}`);
}
function daysLeft(dateStr) {
  if (!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dateStr); due.setHours(0,0,0,0);
  return Math.ceil((due.getTime() - today.getTime()) / 86400000);
}
function genDealId() { return "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function getLocalState() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch { return {}; }
}
function saveLocalState() {
  localStorage.setItem(LS_KEY, JSON.stringify({
    khPhong:S.khPhong, khTuan:S.khTuan, thTuan:S.thTuan, pipeline:S.pipeline
  }));
}
function withTimeout(url, options = {}) {
  const controller = new AbortController();
  const t = setTimeout(() => controller.abort(), FB_TIMEOUT);
  return fetch(url, {...options, signal:controller.signal}).finally(() => clearTimeout(t));
}
async function fbGet(p) {
  try {
    const r = await withTimeout(`${DB}/${ROOT}/${p}.json`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    S.online = true;
    return d == null ? null : d;
  } catch (e) {
    S.online = false;
    S.loadError = e.name === "AbortError" ? "Firebase timeout - dùng dữ liệu local" : e.message;
    return null;
  }
}
async function fbSet(p, d) {
  saveLocalState();
  try {
    const r = await withTimeout(`${DB}/${ROOT}/${p}.json`, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(d)});
    S.online = r.ok;
  } catch {
    S.online = false;
  }
}
async function fbDel(p) {
  saveLocalState();
  try {
    const r = await withTimeout(`${DB}/${ROOT}/${p}.json`, {method:"DELETE"});
    S.online = r.ok;
  } catch {
    S.online = false;
  }
}
async function loadMonth(m) {
  const local = getLocalState();
  ["khPhong","khTuan","thTuan","pipeline"].forEach(k => {
    if (local[k]) S[k] = {...S[k], ...local[k]};
  });
  const [kp, kt, th, pl] = await Promise.all([
    fbGet(`khPhong/${m}`), fbGet(`khTuan/${m}`), fbGet(`thTuan/${m}`), fbGet(`pipeline/${m}`)
  ]);
  S.khPhong[m] = kp || S.khPhong[m] || {};
  S.khTuan[m] = kt || S.khTuan[m] || {};
  S.thTuan[m] = th || S.thTuan[m] || {};
  S.pipeline[m] = pl || S.pipeline[m] || {};
  saveLocalState();
}

function gKP(m = S.month) { return S.khPhong[m] && Object.keys(S.khPhong[m]).length ? S.khPhong[m] : DEFAULT_KH; }
function gKT(m = S.month, t = S.selT, ma) { return (((S.khTuan[m] || {})[t] || {})[ma] || {}); }
function gTH(m = S.month, t = S.selT, ma) { return (((S.thTuan[m] || {})[t] || {})[ma] || {}); }
function gPL(m = S.month, ma) { return (((S.pipeline[m] || {})[ma]) || {}); }
function scopeTuans() { return ["T1","T2","T3","T4"].includes(S.scope) ? [S.scope] : ["T1","T2","T3","T4"]; }
function filteredNVs() { return S.filterNVs.length ? NVS.filter(nv => S.filterNVs.includes(nv.ma)) : NVS; }
function khForNV(m, ma) {
  const rr = {};
  KPIS.forEach(k => rr[k.key] = scopeTuans().reduce((s,t) => s + (gKT(m,t,ma)[k.key] || 0), 0));
  return rr;
}
function thForNV(m, ma) {
  const rr = {};
  KPIS.forEach(k => rr[k.key] = scopeTuans().reduce((s,t) => s + (gTH(m,t,ma)[k.key] || 0), 0));
  return rr;
}
function khPScope(m) {
  if (S.scope === "thang" || S.scope === "ngay" || S.scope === "custom") return gKP(m);
  const rr = {};
  KPIS.forEach(k => rr[k.key] = filteredNVs().reduce((s,nv) => s + (gKT(m,S.scope,nv.ma)[k.key] || 0), 0));
  return rr;
}
function nvScoreCalc(m, ma) {
  const tuans = scopeTuans();
  const wk = STARS.filter(k => tuans.some(t => (gKT(m,t,ma)[k.key] || 0) > 0));
  if (!wk.length) return null;
  return wk.reduce((s,k) => {
    const kh = tuans.reduce((a,t) => a + (gKT(m,t,ma)[k.key] || 0), 0);
    const th = tuans.reduce((a,t) => a + (gTH(m,t,ma)[k.key] || 0), 0);
    return s + (pct(th, kh) || 0);
  }, 0) / wk.length;
}
function getDealsForNV(m, ma) {
  return Object.entries(gPL(m, ma)).map(([id, d]) => ({id, ...d})).sort((a,b) => (b.ts || 0) - (a.ts || 0));
}
function getAllDeals(m) {
  return NVS.flatMap(nv => getDealsForNV(m, nv.ma).map(d => ({...d, ma:nv.ma, ten:nv.ten})));
}
function plTotalValue(deals) { return deals.reduce((s,d) => s + Number(d.gt || 0), 0); }
function plForecast(m) {
  const deals = getAllDeals(m);
  const fc = {};
  KPIS.forEach(k => {
    const done = deals.filter(d => d.sp === k.key && d.gd === "hoan_tat").reduce((s,d) => s + Number(d.gt || 0), 0);
    const pipe = deals.filter(d => d.sp === k.key && d.gd !== "hoan_tat" && ["de_xuat","xu_ly","cho_duyet"].includes(d.gd)).reduce((s,d) => s + Number(d.gt || 0), 0);
    fc[k.key] = done + Math.round(pipe * .6);
  });
  return fc;
}

function rPlPhong(tabBar) {

('${nv.ma}','${S.plEditId}')">🗑 Xóa deal này</button>` : ""}</div>`;

async function saveDeal() {
  const ma = S.plFormNV;
  const sp = document.getElementById("pl-sp").value;
  const kh = document.getElementById("pl-kh").value.trim();
  const gt = Number(document.getElementById("pl-gt").value || 0);
  const gd = document.getElementById("pl-gd").value;
  const han = document.getElementById("pl-han").value;
  const note = document.getElementById("pl-note").value.trim();
  if (!sp) return alert("Vui lòng chọn sản phẩm");
  if (!kh) return alert("Vui lòng nhập mã/tên KH");
  const id = S.plEditId || genDealId();
  const deal = {sp, kh, gt, gd, han, note, ts:Date.now()};
  S.pipeline[S.month] ||= {};
  S.pipeline[S.month][ma] ||= {};
  S.pipeline[S.month][ma][id] = deal;
  await fbSet(`pipeline/${S.month}/${ma}/${id}`, deal);
  closePlForm();
  if (gd === "hoan_tat" && confirm("Deal đã hoàn tất. Cập nhật TH tuần ngay?")) { S.tab = "nhap"; S.selNV = ma; render(); }
}
function editDeal(ma, id) { S.plFormNV = ma; S.plEditId = id; render(); }
async function advDeal(ma, id, gd) {
  const deal = gPL(S.month, ma)[id];
  if (!deal) return;
  deal.gd = gd; deal.ts = Date.now();
  await fbSet(`pipeline/${S.month}/${ma}/${id}`, deal);
  render();
  if (gd === "hoan_tat" && confirm("Deal đã hoàn tất. Cập nhật TH tuần ngay?")) { S.tab = "nhap"; S.selNV = ma; render(); }
}
async function delDeal(ma, id) {
  if (!confirm("Xóa deal này?")) return;
  if (S.pipeline[S.month]?.[ma]) delete S.pipeline[S.month][ma][id];
  await fbDel(`pipeline/${S.month}/${ma}/${id}`);
  closePlForm();
}

function rAlert() {

  }));

  function block(title, color, items) {

}
function rStar() {
  const scored = NVS.map(nv => {
    const scores = STARS.map(k => {
      const kh = gKT(S.month,S.selT,nv.ma)[k.key] || 0, th = gTH(S.month,S.selT,nv.ma)[k.key] || 0;
      return {k, kh, th, p:pct(th,kh)};
    });
    const wk = scores.filter(s => s.kh > 0);
    return {nv, scores, avg:wk.length ? wk.reduce((a,s) => a + (s.p || 0), 0) / wk.length : null};
  }).filter(x => x.avg != null).sort((a,b) => b.avg - a.avg);
  const best = scored[0] && scored[0].avg >= 70 ? scored[0] : null;
  const starHtml = best ? `<div class="star-card"><div style="font-size:24px;margin-bottom:5px">🏆</div><div style="font-size:10px;color:#e8a020;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">${fmtM(S.month)} · ${S.selT} - Nhân viên xuất sắc</div><div style="font-size:16px;font-weight:900;color:#ffc84a">${escapeHtml(best.nv.ten)}</div><div class="sk">${best.scores.map(s => `<div class="sk-i"><div>${s.k.icon}</div><div style="font-size:13px;font-weight:900;color:${pc(s.p)};font-family:'Space Mono',monospace">${s.kh ? fmt(s.th,s.k.unit) : "—"}</div><div style="font-size:9px;color:var(--dim)">${s.k.label}</div><div style="font-size:10px;font-weight:900;color:${pc(s.p)}">${p2s(s.p)}</div></div>`).join("")}</div></div>` : `<div class="card" style="text-align:center;padding:20px"><div style="font-size:28px;margin-bottom:6px">🏅</div><div style="font-weight:800;color:var(--dim)">Chưa có NV xuất sắc ${S.selT}</div></div>`;
  return `<div class="pad"><div class="sec">🌟 Tuyên dương & Nhắc nhở</div><div class="tt">${["T1","T2","T3","T4"].map(t => `<button class="tb ${S.selT === t ? "on" : ""}" onclick="setT('${t}')">${t}</button>`).join("")}</div>${starHtml}<div class="sec">🥇 Top tuần ${S.selT}</div>${scored.slice(0,3).map((x,i) => `<div class="wi">${["🥇","🥈","🥉"][i]}${av(x.nv.ten,x.nv.ma,32)}<div style="flex:1"><div class="nv-n">${escapeHtml(x.nv.ten)}</div></div><div style="font-size:16px;font-weight:900;color:${pc(x.avg)};font-family:'Space Mono',monospace">${p2s(x.avg)}</div></div>`).join("") || `<div class="empty">Chưa có dữ liệu</div>`}</div>`;
}

    return `<button class="nvi ${has ? "hk" : ""}" onclick="selNVKh('${nv.ma}')">${av(nv.ten,nv.ma)}<div style="flex:1"><div class="nv-n">${escapeHtml(nv.ten)}</div>${has ? `<div class="chips">${STARS.map(k => chip(`${k.icon} ${fmt(kh[k.key] || 0,k.unit)}`, k.color)).join("")}</div>` : `<div class="nv-s">Chưa giao KH ${S.selT}</div>`}</div><span style="color:${has ? "#ffc84a" : "var(--dim)"}">›</span></button>`;
  }).join("");
  return `<div class="pad"><div class="sec">📋 KH Tuần · ${fmtM(S.month)}</div><div class="tt">${["T1","T2","T3","T4"].map(t => `<button class="tb ${S.selT === t ? "on" : ""}" onclick="setTKh('${t}')">${t}</button>`).join("")}</div>${rows}</div>`;
}
function rKhTuanForm() {
  const nv = NVS.find(n => n.ma === S.selNV);
  if (!nv) return "";
  const cur = gKT(S.month,S.selT,nv.ma);
  return `<div class="pad"><button class="bback" onclick="backKhT()">← Danh sách NV</button><div class="card card-hi"><div style="display:flex;align-items:center;gap:11px">${av(nv.ten,nv.ma,44)}<div><div style="font-weight:900;font-size:14px">${escapeHtml(nv.ten)}</div><div class="nv-s">Giao KH ${S.selT} · ${fmtM(S.month)}</div></div></div></div>${KPIS.map(k => `<div class="ff" style="border-color:${k.color}25"><div class="fh"><div class="fl"><span style="font-size:19px">${k.icon}</span><div><div class="fn" style="color:${k.star ? "#ffc84a" : "#fff"}">${k.label}</div><div class="fk">KH tháng phòng: ${fmt(gKP()[k.key],k.unit)}</div></div></div></div><input type="number" id="kt_${k.key}" value="${cur[k.key] || ""}" placeholder="KH ${S.selT} - ${k.label}"></div>`).join("")}<button class="bsave" id="kt-btn" onclick="saveKhT()">💾 Giao KH ${S.selT} - ${escapeHtml(nv.ten.split(" ").pop())}</button></div>`;
}
async function saveKhT() {
  const nv = NVS.find(n => n.ma === S.selNV);
  if (!nv) return;
  const d = {};
  KPIS.forEach(k => {
    const el = document.getElementById(`kt_${k.key}`);
    if (el && el.value !== "") d[k.key] = Number(el.value);
  });
  S.khTuan[S.month] ||= {};
  S.khTuan[S.month][S.selT] ||= {};
  S.khTuan[S.month][S.selT][nv.ma] = d;
  await fbSet(`khTuan/${S.month}/${S.selT}/${nv.ma}`, d);
  S.selNV = null;
  render();
}

function openNVPicker() {
  S.nvpTemp = S.filterNVs.slice();
  nvpSorted = false;
  renderNVPicker();
  document.getElementById("nvp-modal").style.display = "flex";
  document.body.style.overflow = "hidden";
}
function closeNVPicker() { document.getElementById("nvp-modal").style.display = "none"; document.body.style.overflow = ""; }
function nvpSelectAll() { S.nvpTemp = NVS.map(nv => nv.ma); renderNVPicker(); }
function nvpClearAll() { S.nvpTemp = []; renderNVPicker(); }
function nvpToggle(ma) { const i = S.nvpTemp.indexOf(ma); if (i >= 0) S.nvpTemp.splice(i,1); else S.nvpTemp.push(ma); renderNVPicker(); }
function nvpSortScore() { nvpSorted = !nvpSorted; renderNVPicker(); }
function nvpConfirm() { S.filterNVs = S.nvpTemp.slice(); closeNVPicker(); render(); }
function renderNVPicker() {
  let list = NVS.slice();
  if (nvpSorted) list = list.map(nv => ({nv, sc:nvScoreCalc(S.month,nv.ma)})).sort((a,b) => (b.sc ?? -1) - (a.sc ?? -1)).map(x => x.nv);
  document.getElementById("nvp-sub").textContent = S.nvpTemp.length ? `${S.nvpTemp.length} nhân viên được chọn` : "Đang xem toàn phòng - chọn để lọc riêng";
  document.getElementById("nvp-list").innerHTML = list.map(nv => {
    const isSel = S.nvpTemp.includes(nv.ma);
    const sc = nvScoreCalc(S.month,nv.ma);
    return `<div class="nvp-item ${isSel ? "sel" : ""}" onclick="nvpToggle('${nv.ma}')">${av(nv.ten,nv.ma,36)}<div style="flex:1"><div style="font-weight:800;font-size:13px">${escapeHtml(nv.ten)}</div><div style="margin-top:2px;font-size:11px;color:${pc(sc)};font-weight:800">${sc != null ? `${p2s(sc)} · ${stl(sc).l}` : "Chưa có KH"}</div></div><div class="nvp-check">${isSel ? "✓" : ""}</div></div>`;
  }).join("");
  document.querySelector("#nvp-modal .bsave").textContent = S.nvpTemp.length ? `Xem ${S.nvpTemp.length} NV đã chọn` : `Xem toàn phòng (${NVS.length} NV)`;
}

function openPinModal(cb) {
  pinBuf = ""; pinCb = cb;
  document.getElementById("pin-modal").style.display = "flex";
  document.getElementById("pin-err").textContent = "";
  rPinDots();
}
function closePinModal() { document.getElementById("pin-modal").style.display = "none"; pinBuf = ""; pinCb = null; }
function rPinDots() { for (let i=0;i<4;i++) document.getElementById(`pd${i}`).className = "pin-dot" + (i < pinBuf.length ? " fill" : ""); }
function pinAdd(n) {
  if (pinBuf.length >= 4) return;
  pinBuf += String(n); rPinDots();
  if (pinBuf.length === 4) {
    if (pinBuf === PIN) { pinAuth = true; const cb = pinCb; closePinModal(); if (cb) cb(); }
    else { document.getElementById("pin-err").textContent = "Mã PIN không đúng. Thử lại."; setTimeout(() => { pinBuf = ""; rPinDots(); }, 650); }
  }
}
function pinDel() { pinBuf = pinBuf.slice(0,-1); rPinDots(); }

function openExpModal() { document.getElementById("exp-modal").style.display = "flex"; }
function closeExpModal() { document.getElementById("exp-modal").style.display = "none"; }
function buildReport(m, scope) {
  const tuans = scope === "thang" ? ["T1","T2","T3","T4"] : [scope];
  const data = filteredNVs().map(nv => {
    const kh = {}, th = {};
    KPIS.forEach(k => { kh[k.key] = tuans.reduce((s,t) => s + (gKT(m,t,nv.ma)[k.key] || 0), 0); th[k.key] = tuans.reduce((s,t) => s + (gTH(m,t,nv.ma)[k.key] || 0), 0); });
    const wk = STARS.filter(k => kh[k.key] > 0);
    const score = wk.length ? wk.reduce((s,k) => s + (pct(th[k.key], kh[k.key]) || 0), 0) / wk.length : null;
    return {nv,kh,th,score};
  }).sort((a,b) => (b.score ?? -1) - (a.score ?? -1));
  return `<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>Báo cáo KPI</title><style>body{font-family:Arial,sans-serif;padding:28px;color:#172033}h1{font-size:22px;color:#1a3a6e}table{width:100%;border-collapse:collapse;margin-top:16px}th{background:#1a3a6e;color:#fff;padding:8px;font-size:12px}td{border-bottom:1px solid #e6eaf2;padding:8px;font-size:12px}.score{font-weight:800}</style></head><body><h1>Nam A Bank - Báo cáo KPI ${fmtM(m)} ${scope === "thang" ? "cả tháng" : scope}</h1><p>Xuất lúc ${new Date().toLocaleString("vi-VN")} · ${S.filterNVs.length ? S.filterNVs.length + " NV được chọn" : "Toàn phòng"}</p><table><thead><tr><th>#</th><th>Nhân viên</th>${STARS.map(k => `<th>${k.icon} ${k.label}</th>`).join("")}<th>Điểm TB</th></tr></thead><tbody>${data.map((d,i) => `<tr><td>${i+1}</td><td><b>${escapeHtml(d.nv.ten)}</b></td>${STARS.map(k => `<td>${fmt(d.th[k.key], k.unit)} / ${fmt(d.kh[k.key], k.unit)}<br><b style="color:${pc(pct(d.th[k.key], d.kh[k.key]))}">${p2s(pct(d.th[k.key], d.kh[k.key]))}</b></td>`).join("")}<td class="score" style="color:${pc(d.score)}">${p2s(d.score)}</td></tr>`).join("")}</tbody></table><p style="margin-top:20px;color:#667">Tài liệu nội bộ - KPI Banking NAB System</p></body></html>`;
}
function printReport(scope) {
  closeExpModal();
  const win = window.open("", "_blank", "width=900,height=700");
  if (!win) return alert("Vui lòng cho phép popup để xuất báo cáo");
  win.document.write(buildReport(S.month, scope));
  win.document.close();
  win.onload = () => { win.focus(); setTimeout(() => win.print(), 300); };
}

function setTab(t) {
  if (t === "kh" && !pinAuth) { openPinModal(() => { S.tab = t; S.selNV = null; S.detailNV = null; S.plFormNV = null; render(); }); return; }
  S.tab = t; S.selNV = null; S.detailNV = null; S.plFormNV = null; render();
}
function setKhTab(t) { S.khTab = t; S.selNV = null; render(); }
function setMonth(m) { S.month = m; S.selNV = null; S.detailNV = null; loadMonth(m).then(render); }
function setT(t) { S.selT = t; render(); }
function setTKh(t) { S.selT = t; render(); }
function setScope(s) { S.scope = s; render(); }
function selNV(ma) { S.selNV = ma; render(); }
function selNVKh(ma) { S.selNV = ma; render(); }
function backNhap() { S.selNV = null; render(); }
function backKhT() { S.selNV = null; render(); }
function showDetail(ma) { S.detailNV = ma; render(); }
function backDash() { S.detailNV = null; render(); }
function clearNVFilter() { S.filterNVs = []; render(); }
function setPlTab(t) { S.plTab = t; S.selNV = null; render(); }
function plOpenNV(ma) { S.selNV = ma; S.tab = "pl"; render(); }
function openPlForm(ma) { S.plFormNV = ma; S.plEditId = null; render(); }
function backPl() { S.selNV = null; S.plFormNV = null; render(); }
function closePlForm() { S.plFormNV = null; S.plEditId = null; render(); }

async function init() {
  const loading = document.getElementById("loading");
  const app = document.getElementById("app");
  try {
    await loadMonth(CUR_M);
  } catch (e) {
    console.error(e);
    S.loadError = e.message || "Không tải được dữ liệu";
  } finally {
    loading.style.display = "none";
    app.style.display = "block";
    render();
  }
  setInterval(async () => {
    const el = document.activeElement;
    const isTyping = el && ["INPUT","TEXTAREA","SELECT"].includes(el.tagName);
    if (isTyping || S.selNV || S.plFormNV) return;
    await loadMonth(S.month);
    render();
  }, 30000);
}
window.addEventListener("error", e => {
  const loading = document.getElementById("loading");
  const app = document.getElementById("app");
  if (loading) loading.style.display = "none";
  if (app) {
    app.style.display = "block";
    app.innerHTML = `<div class="error-box">Lỗi JavaScript:\n${escapeHtml(e.message)}\n${escapeHtml(e.filename || "")}:${e.lineno || ""}</div>`;
  }
});
init();
</script>
</body>
</html>
