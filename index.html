<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KPI Banking — NAB</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background:#050d1a; color:#e2e8f0; min-height:100vh; }
body { font-family:'Segoe UI',system-ui,sans-serif; }
#root { max-width:480px; margin:0 auto; min-height:100vh; background:#050d1a; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; }
</style>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;background:#050d1a">
    <div style="font-size:40px">🏦</div>
    <div style="color:#f59e0b;font-size:16px;font-weight:700">KPI Banking NAB</div>
    <div style="color:#64748b;font-size:12px">Đang tải...</div>
  </div>
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════
const NV_LIST = [
  { ma:"10924", ten:"TRƯƠNG ANH TOÀN" },
  { ma:"16032", ten:"DƯƠNG HỒNG PHÁP" },
  { ma:"10847", ten:"TRẦN VIẾT DUY" },
  { ma:"10852", ten:"ĐỖ THỊ HỒNG SƯƠNG" },
  { ma:"13933", ten:"VÕ UYÊN BÌNH" },
  { ma:"15642", ten:"TRẦN CÔNG LUẬT" },
  { ma:"17339", ten:"PHẠM THỊ NGỌC HUYỀN" },
  { ma:"17489", ten:"NGUYỄN LÂM KHA" },
  { ma:"NV009", ten:"NGUYỄN THÀNH ĐẠT" },
  { ma:"NV010", ten:"ĐẶNG VÕ DUYÊN TRINH" },
  { ma:"NV011", ten:"LÊ THỊ BÍCH PHƯỢNG" },
  { ma:"NV012", ten:"NGUYỄN HỒNG PHƯƠNG THANH" },
];

const KPI_CFG = [
  { key:"huy_dong", label:"Huy Động", short:"HD", icon:"💰", unit:"tr đ", star:true,  color:"#f59e0b" },
  { key:"du_no",    label:"Dư Nợ",   short:"DN", icon:"🏦", unit:"tr đ", star:true,  color:"#3b82f6" },
  { key:"the_td",   label:"Thẻ TD",  short:"TT", icon:"💳", unit:"thẻ",  star:true,  color:"#8b5cf6" },
  { key:"tk_hkd",   label:"TK HKD",  short:"HK", icon:"🏢", unit:"TK",   star:false, color:"#10b981" },
  { key:"qr_code",  label:"QR Code", short:"QR", icon:"📱", unit:"QR",   star:false, color:"#06b6d4" },
  { key:"cif",      label:"CIF",     short:"CF", icon:"👤", unit:"CIF",  star:false, color:"#ec4899" },
];

const TUAN_LIST = ["T1","T2","T3","T4"];
const now = new Date();
const CUR_MONTH = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
const DEFAULT_KH_PHONG = { huy_dong:47900, du_no:31000, the_td:82, tk_hkd:80, qr_code:220, cif:415 };

// ═══════════════════════════════════════════
// FIREBASE REST API — data layer
// ═══════════════════════════════════════════
var DB_URL  = "https://kpi-banking-nab-default-rtdb.asia-southeast1.firebasedatabase.app";
var DB_ROOT_PATH = "kpi_banking";

async function fbGet(path) {
  try {
    var r = await fetch(DB_URL + "/" + path + ".json");
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

async function fbSet(path, data) {
  try {
    await fetch(DB_URL + "/" + path + ".json", {
      method: "PUT",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(data)
    });
  } catch(e) { console.warn("fbSet:", e.message); }
}

async function loadAllData(month) {
  try {
    var [d1, d2, d3] = await Promise.all([
      fbGet(DB_ROOT_PATH + "/khPhong/" + month),
      fbGet(DB_ROOT_PATH + "/khTuan/"  + month),
      fbGet(DB_ROOT_PATH + "/thTuan/"  + month),
    ]);
    return {
      khPhong: d1 ? {[month]: d1} : {},
      khTuan:  d2 ? {[month]: d2} : {},
      thTuan:  d3 ? {[month]: d3} : {},
      online: !!(d1 || d2 || d3),
    };
  } catch(e) {
    return { khPhong:{}, khTuan:{}, thTuan:{}, online:false };
  }
}

async function saveKhPhongData(month, data, cur) {
  const next = {...cur, [month]: {...data}};
  fbSet(DB_ROOT_PATH + "/khPhong/" + month, data);
  return next;
}

async function saveKhTuanData(month, tuan, ma_nv, data, cur) {
  const next = JSON.parse(JSON.stringify(cur));
  if(!next[month]) next[month]={};
  if(!next[month][tuan]) next[month][tuan]={};
  next[month][tuan][ma_nv] = {...data};
  fbSet(DB_ROOT_PATH + "/khTuan/" + month + "/" + tuan + "/" + ma_nv, data);
  return next;
}

async function saveThTuanData(month, tuan, ma_nv, data, cur) {
  const next = JSON.parse(JSON.stringify(cur));
  if(!next[month]) next[month]={};
  if(!next[month][tuan]) next[month][tuan]={};
  const record = {...data, updatedAt: Date.now()};
  next[month][tuan][ma_nv] = record;
  fbSet(DB_ROOT_PATH + "/thTuan/" + month + "/" + tuan + "/" + ma_nv, record);
  return next;
}

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
const n = v => (v===null||v===undefined||v===""||isNaN(+v)) ? null : +v;
const fmt = (v,u="") => { const x=n(v); return x===null?"—":x.toLocaleString("vi-VN")+(u?" "+u:""); };
const pct = (th,kh) => (kh&&kh>0&&th!==null) ? th/kh*100 : null;
const p2s = p => p===null?"—":Math.round(p)+"%";

const C = {
  good:"#10b981", warn:"#f59e0b", low:"#f97316", bad:"#ef4444", mute:"#475569",
  bg0:"#050d1a", bg1:"#0a1628", bg2:"#111f35", bg3:"#1a2e48",
  border:"#1e3a5f", gold:"#f59e0b", text:"#e2e8f0", dim:"#94a3b8",
};
const pc = p => p===null?C.mute:p>=100?C.good:p>=70?C.warn:p>=40?C.low:C.bad;
const st = p => p===null?{l:"Chưa có KH",c:C.mute}:p>=100?{l:"✅ Đạt",c:C.good}:p>=70?{l:"⚡ Khá",c:C.warn}:p>=40?{l:"⚠️ Trung bình",c:C.low}:{l:"🚨 Cần đẩy",c:C.bad};

const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const acChar = name => name.split(" ").pop()[0]||"?";
const acColor = ma => { const cols=["#f59e0b","#3b82f6","#8b5cf6","#10b981","#ec4899","#06b6d4","#f97316","#a855f7"]; let h=0; for(let i=0;i<ma.length;i++)h=(h*31+ma.charCodeAt(i))%cols.length; return cols[h]; };
const fmtTs = ts => { if(!ts)return"—"; const d=new Date(ts); return `${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

// Deep clone
const clone = v => JSON.parse(JSON.stringify(v));

// ═══════════════════════════════════════════
// UI ATOMS
// ═══════════════════════════════════════════
function Bar({v=0,max=0,color,h=6}){
  const w=max>0?Math.min(100,Math.max(0,v/max*100)):0;
  return <div style={{background:"#08111e",borderRadius:h,height:h,overflow:"hidden"}}>
    <div style={{width:`${w}%`,height:"100%",background:color,borderRadius:h,transition:"width .5s"}}/>
  </div>;
}

function Ring({p=0,size=50,sw=6}){
  const r=(size-sw*2)/2, c2=2*Math.PI*r, val=Math.min(Math.max(p||0,0),100);
  return <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#08111e" strokeWidth={sw}/>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={pc(p)} strokeWidth={sw}
      strokeDasharray={`${val/100*c2} ${c2}`} strokeLinecap="round" style={{transition:"stroke-dasharray .6s"}}/>
  </svg>;
}

function Av({name,ma,size=38}){
  const ac=acColor(ma);
  return <div style={{width:size,height:size,borderRadius:"50%",background:ac+"1a",border:`1.5px solid ${ac}55`,
    display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*.38,fontWeight:800,color:ac,flexShrink:0}}>
    {acChar(name)}
  </div>;
}

function Tag({label,color,bg,sm}){
  return <span style={{background:bg||color+"22",color,borderRadius:6,padding:sm?"2px 7px":"4px 11px",
    fontSize:sm?10:12,fontWeight:700,whiteSpace:"nowrap"}}>{label}</span>;
}

function Card({ch,style={}}){
  return <div style={{background:C.bg2,borderRadius:14,padding:16,border:`1px solid ${C.border}22`,...style}}>{ch}</div>;
}

function Sec({title,sub}){
  return <div style={{marginBottom:10}}>
    <div style={{fontSize:11,color:C.dim,textTransform:"uppercase",letterSpacing:".1em",fontWeight:700}}>{title}</div>
    {sub&&<div style={{fontSize:12,color:C.mute,marginTop:2}}>{sub}</div>}
  </div>;
}

function NInput({value,onChange,placeholder,style={}}){
  return <input type="number" inputMode="decimal" value={value??""} onChange={e=>onChange(e.target.value)}
    placeholder={placeholder} style={{width:"100%",background:C.bg1,border:`1px solid ${C.border}`,borderRadius:10,
      padding:"12px 13px",color:C.text,fontSize:16,outline:"none",boxSizing:"border-box",fontWeight:600,...style}}/>;
}

function SaveBtn({onSave,saving,saved,label}){
  return <button onClick={onSave} disabled={saving||saved}
    style={{width:"100%",padding:16,borderRadius:14,border:"none",cursor:"pointer",marginTop:8,
      background:saved?"#10b981":`linear-gradient(135deg,${C.gold},#d97706)`,
      color:"#040a12",fontWeight:800,fontSize:16,transition:"all .3s"}}>
    {saved?"✅ ĐÃ LƯU!":saving?"⏳ Đang lưu...":label}
  </button>;
}

// ═══════════════════════════════════════════
// VIEW: KH PHÒNG (KH tháng toàn phòng)
// ═══════════════════════════════════════════
function KhPhongView({khPhong, onSave, month}){
  const cur = khPhong[month]||DEFAULT_KH_PHONG;
  const [vals,setVals] = useState({...cur});
  const [saving,setSaving] = useState(false);
  const [saved,setSaved] = useState(false);

  const save = async()=>{
    setSaving(true);
    await onSave(vals);
    setSaving(false); setSaved(true); setTimeout(()=>setSaved(false),1500);
  };

  return <div style={{padding:16}}>
    <Sec title="🏦 KH tháng — Toàn phòng" sub={`Chỉ tiêu ban lãnh đạo giao · ${month}`}/>
    <div style={{background:C.bg1,borderRadius:12,padding:12,marginBottom:16,border:`1px solid ${C.warn}33`}}>
      <div style={{fontSize:12,color:C.warn,fontWeight:700,marginBottom:4}}>⚡ Nguyên tắc</div>
      <div style={{fontSize:12,color:C.dim,lineHeight:1.6}}>
        Đây là tổng KH tháng ban lãnh đạo giao. Khi phân bổ KH tuần cho NV, hệ thống tự kiểm soát tổng không vượt mức này.
      </div>
    </div>
    {KPI_CFG.map(k=><div key={k.key} style={{background:C.bg2,borderRadius:14,padding:14,marginBottom:10,
      border:`1px solid ${k.color}33`}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
        <span style={{fontSize:22}}>{k.icon}</span>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:14,color:k.star?C.gold:C.text}}>{k.star?"⭐ ":""}{k.label}</div>
          <div style={{fontSize:11,color:C.mute}}>Đơn vị: {k.unit}</div>
        </div>
        {(vals[k.key]||0)>0&&<Tag label={fmt(vals[k.key],k.unit)} color={k.color}/>}
      </div>
      <NInput value={vals[k.key]} onChange={v=>setVals(p=>({...p,[k.key]:n(v)||0}))}
        placeholder={`KH tháng ${k.label}`}/>
    </div>)}
    <SaveBtn onSave={save} saving={saving} saved={saved} label="💾 LƯU KH PHÒNG"/>
  </div>;
}

// ═══════════════════════════════════════════
// VIEW: GIAO KH TUẦN (phân bổ cho NV)
// ═══════════════════════════════════════════
function KhTuanView({khPhong,khTuan,onSaveKh,month,thTuan}){
  const [selT,setSelT] = useState("T1");
  const [selNV,setSelNV] = useState(null);
  const [vals,setVals] = useState({});
  const [saved,setSaved] = useState(false);
  const [view,setView] = useState("list"); // list | form | overview

  const khP = khPhong[month]||DEFAULT_KH_PHONG;

  // Tổng KH đã giao trong tháng per KPI (tất cả tuần)
  const sumGiaoThang = (ma,kk) => TUAN_LIST.reduce((s,t)=>s+(khTuan?.[month]?.[t]?.[ma]?.[kk]||0),0);
  const sumGiaoPhong = kk => NV_LIST.reduce((s,nv)=>s+sumGiaoThang(nv.ma,kk),0);

  const tuanData = khTuan?.[month]?.[selT]||{};

  const openForm = nv => {
    setVals(Object.fromEntries(KPI_CFG.map(k=>[k.key,tuanData[nv.ma]?.[k.key]??null])));
    setSelNV(nv); setView("form");
  };

  const doSave = async()=>{
    // Validate không vượt KH phòng
    const errs=[];
    KPI_CFG.forEach(k=>{
      const newV=n(vals[k.key])||0, oldV=tuanData[selNV.ma]?.[k.key]||0;
      const giaoPhongExcl=sumGiaoPhong(k.key)-sumGiaoThang(selNV.ma,k.key);
      const nvSumExcl=sumGiaoThang(selNV.ma,k.key)-oldV;
      if(giaoPhongExcl+nvSumExcl+newV>(khP[k.key]||0)) errs.push(k.label);
    });
    if(errs.length){ alert(`⚠️ Vượt KH tháng phòng:\n${errs.join(", ")}`); return; }
    const data = Object.fromEntries(KPI_CFG.map(k=>[k.key,n(vals[k.key])||0]));
    await onSaveKh(selT, selNV.ma, data);
    setSaved(true); setTimeout(()=>{setSaved(false);setView("list");setSelNV(null);},1200);
  };

  // ── OVERVIEW ──
  if(view==="overview") return <div style={{padding:16}}>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
      <button onClick={()=>setView("list")} style={{background:"none",border:"none",color:C.dim,cursor:"pointer",fontSize:14,padding:0}}>←</button>
      <div style={{fontWeight:700,color:C.gold,fontSize:15}}>{selT} — Tổng quan KH vs TH</div>
    </div>
    {KPI_CFG.map(k=>{
      const giaoPhong=sumGiaoPhong(k.key), khPV=khP[k.key]||0;
      const p=pct(giaoPhong,khPV);
      return <div key={k.key} style={{background:C.bg2,borderRadius:14,padding:14,marginBottom:10,border:`1px solid ${k.color}33`}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
          <span style={{fontSize:19}}>{k.icon}</span>
          <div style={{fontWeight:700,fontSize:13,color:k.star?C.gold:C.text,flex:1}}>{k.label}</div>
          <div style={{fontSize:12,textAlign:"right"}}>
            <span style={{color:pc(p),fontWeight:800}}>{fmt(giaoPhong,k.unit)}</span>
            <span style={{color:C.mute}}> / {fmt(khPV,k.unit)}</span>
          </div>
        </div>
        <Bar v={giaoPhong} max={khPV} color={k.color}/>
        <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:5}}>
          {NV_LIST.map(nv=>{
            const kh=tuanData[nv.ma]?.[k.key]||0;
            const th=thTuan?.[month]?.[selT]?.[nv.ma]?.[k.key]??null;
            if(!kh&&th===null) return null;
            const pp=pct(th??0,kh);
            return <div key={nv.ma} style={{display:"flex",alignItems:"center",gap:8,background:C.bg1,borderRadius:8,padding:"7px 10px"}}>
              <Av name={nv.ten} ma={nv.ma} size={26}/>
              <div style={{flex:1,overflow:"hidden"}}>
                <div style={{fontSize:12,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {nv.ten.split(" ").slice(-2).join(" ")}
                </div>
                <div style={{fontSize:10,color:C.mute}}>KH: {fmt(kh,k.unit)}</div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontWeight:700,fontSize:12,color:kh?pc(pp):C.mute}}>{kh?fmt(th??0,k.unit):"—"}</div>
                {kh>0&&<Tag label={p2s(pp)} color={pc(pp)} sm/>}
              </div>
            </div>;
          })}
        </div>
      </div>;
    })}
  </div>;

  // ── FORM ──
  if(view==="form"&&selNV) return <div style={{padding:16}}>
    <button onClick={()=>setView("list")} style={{background:"none",border:"none",color:C.dim,cursor:"pointer",fontSize:13,padding:0,marginBottom:14}}>
      ← Danh sách
    </button>
    <div style={{background:`linear-gradient(135deg,#1a3050,${C.bg0})`,borderRadius:14,padding:14,marginBottom:16,border:`1px solid ${C.border}44`}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <Av name={selNV.ten} ma={selNV.ma} size={46}/>
        <div>
          <div style={{fontWeight:700,fontSize:15}}>{selNV.ten}</div>
          <div style={{fontSize:11,color:C.dim}}>Giao KH {selT} · {month}</div>
        </div>
      </div>
    </div>
    {KPI_CFG.map(k=>{
      const newV=n(vals[k.key])||0, oldV=tuanData[selNV.ma]?.[k.key]||0;
      const giaoExcl=sumGiaoPhong(k.key)-sumGiaoThang(selNV.ma,k.key);
      const nvExcl=sumGiaoThang(selNV.ma,k.key)-oldV;
      const conPhong=(khP[k.key]||0)-giaoExcl-nvExcl-newV;
      const warn=conPhong<0;
      const th=thTuan?.[month]?.[selT]?.[selNV.ma]?.[k.key]??null;
      const pp=pct(th??0,newV);
      return <div key={k.key} style={{background:C.bg2,borderRadius:14,padding:14,marginBottom:10,
        border:`1px solid ${warn?C.bad:k.color}33`}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
          <span style={{fontSize:20}}>{k.icon}</span>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:14,color:k.star?C.gold:C.text}}>{k.star?"⭐ ":""}{k.label}</div>
            <div style={{fontSize:10,color:warn?C.bad:C.mute}}>
              Còn lại phòng: <b style={{color:warn?C.bad:C.good}}>{fmt(conPhong,k.unit)}</b>
              {warn&&" — Vượt!"}
            </div>
          </div>
          {newV>0&&th!==null&&<Tag label={`TH: ${fmt(th,k.unit)}`} color={pc(pp)} sm/>}
        </div>
        <NInput value={vals[k.key]} onChange={v=>setVals(p=>({...p,[k.key]:v}))}
          placeholder={`KH ${selT} — ${k.label} (${k.unit})`}
          style={{borderColor:warn?"#ef444466":undefined}}/>
        {newV>0&&<div style={{marginTop:8}}>
          <Bar v={newV} max={khP[k.key]} color={k.color}/>
          <div style={{fontSize:10,color:C.mute,marginTop:3,textAlign:"right"}}>
            {p2s(pct(newV,khP[k.key]))} KH tháng phòng
          </div>
        </div>}
      </div>;
    })}
    <SaveBtn onSave={doSave} saving={false} saved={saved} label="💾 GIAO KẾ HOẠCH"/>
  </div>;

  // ── LIST ──
  return <div style={{padding:16}}>
    <Sec title={`📋 Kế hoạch tuần · ${month}`} sub="Phân bổ chỉ tiêu tuần cho từng nhân viên"/>

    {/* Tuần selector */}
    <div style={{display:"flex",gap:6,marginBottom:14}}>
      {TUAN_LIST.map(t=><button key={t} onClick={()=>setSelT(t)}
        style={{flex:1,padding:"10px 0",borderRadius:10,border:"1px solid",
          borderColor:selT===t?"#3b82f6":C.border,background:selT===t?"#3b82f622":C.bg2,
          color:selT===t?"#3b82f6":C.dim,fontWeight:700,fontSize:14,cursor:"pointer"}}>{t}</button>)}
    </div>

    {/* KH còn lại phòng */}
    <div style={{overflowX:"auto",marginBottom:14}}>
      <div style={{display:"flex",gap:6,width:"max-content",paddingBottom:2}}>
        {KPI_CFG.map(k=>{
          const con=(khP[k.key]||0)-sumGiaoPhong(k.key), warn=con<0;
          return <div key={k.key} style={{background:C.bg1,borderRadius:10,padding:"8px 12px",
            border:`1px solid ${warn?C.bad:k.color}22`,textAlign:"center",minWidth:80}}>
            <div style={{fontSize:10,color:k.color,marginBottom:2}}>{k.icon} {k.short}</div>
            <div style={{fontSize:13,fontWeight:800,color:warn?C.bad:C.text}}>{fmt(con,k.unit)}</div>
            <div style={{fontSize:9,color:C.mute}}>còn phân bổ</div>
          </div>;
        })}
      </div>
    </div>

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <div style={{fontSize:12,color:C.dim}}>Bấm vào NV để giao KH {selT}</div>
      <button onClick={()=>setView("overview")}
        style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:8,
          padding:"6px 12px",color:C.gold,fontSize:12,cursor:"pointer",fontWeight:600}}>📊 Tổng quan</button>
    </div>

    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {NV_LIST.map(nv=>{
        const nvKh=tuanData[nv.ma]||{};
        const hasKh=KPI_CFG.some(k=>(nvKh[k.key]||0)>0);
        const starTH=KPI_CFG.filter(k=>k.star).map(k=>({k,th:thTuan?.[month]?.[selT]?.[nv.ma]?.[k.key]??null,kh:nvKh[k.key]||0}));
        return <button key={nv.ma} onClick={()=>openForm(nv)}
          style={{background:C.bg2,border:`1px solid ${hasKh?C.gold+"44":C.border}`,
            borderRadius:14,padding:14,textAlign:"left",cursor:"pointer",width:"100%"}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <Av name={nv.ten} ma={nv.ma}/>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:13}}>{nv.ten}</div>
              {hasKh
                ? <div style={{display:"flex",gap:4,marginTop:5,flexWrap:"wrap"}}>
                    {starTH.map(({k,th,kh})=>{
                      const pp=kh>0?pct(th??0,kh):null;
                      return <span key={k.key} style={{fontSize:10,background:C.bg1,borderRadius:5,
                        padding:"2px 6px",color:pp!==null?pc(pp):C.dim}}>
                        {k.icon} KH:{fmt(kh,k.unit)} TH:{kh?fmt(th??0,k.unit):"—"}
                      </span>;
                    })}
                  </div>
                : <div style={{fontSize:11,color:C.mute,marginTop:3}}>Chưa giao KH {selT}</div>}
            </div>
            <span style={{color:hasKh?C.gold:C.mute,fontSize:20}}>›</span>
          </div>
        </button>;
      })}
    </div>
  </div>;
}

// ═══════════════════════════════════════════
// VIEW: NHẬP LIỆU (nhập TH theo tuần, linh hoạt)
// ═══════════════════════════════════════════
function NhapView({thTuan, onSaveTh, khTuan, month}){
  const [selNV,setSelNV] = useState(null);
  const [selT,setSelT] = useState("T1");
  const [search,setSearch] = useState("");

  const filtered=NV_LIST.filter(nv=>nv.ten.toLowerCase().includes(search.toLowerCase())||nv.ma.includes(search));

  if(selNV) return <NhapForm nv={selNV} selT={selT} month={month}
    khTuan={khTuan} thTuan={thTuan} onSaveTh={onSaveTh} onBack={()=>setSelNV(null)}/>;

  return <div style={{padding:16}}>
    <Sec title="✏️ Nhập / Cập nhật TH" sub="Chọn tuần + NV — nhập lũy kế TH của tuần đó"/>

    {/* Hướng dẫn nghiệp vụ */}
    <div style={{background:C.bg1,borderRadius:12,padding:12,marginBottom:14,border:`1px solid #3b82f633`}}>
      <div style={{fontSize:12,color:"#3b82f6",fontWeight:700,marginBottom:4}}>📌 Cách nhập</div>
      <div style={{fontSize:12,color:C.dim,lineHeight:1.6}}>
        Nhập <b style={{color:C.text}}>tổng lũy kế TH</b> của tuần — có thể cập nhật bất kỳ lúc nào. Ví dụ cuối tuần mới nhập, hoặc điều chỉnh khi có chỉ đạo mới.
      </div>
    </div>

    {/* Chọn tuần */}
    <div style={{display:"flex",gap:6,marginBottom:14}}>
      {TUAN_LIST.map(t=>{
        const hasData=NV_LIST.some(nv=>KPI_CFG.some(k=>(thTuan?.[month]?.[t]?.[nv.ma]?.[k.key]??null)!==null));
        return <button key={t} onClick={()=>setSelT(t)}
          style={{flex:1,padding:"10px 0",borderRadius:10,border:"1px solid",
            borderColor:selT===t?"#3b82f6":C.border,background:selT===t?"#3b82f622":C.bg2,
            color:selT===t?"#3b82f6":C.dim,fontWeight:700,fontSize:14,cursor:"pointer",position:"relative"}}>
          {t}
          {hasData&&<div style={{position:"absolute",top:4,right:4,width:6,height:6,borderRadius:"50%",background:C.good}}/>}
        </button>;
      })}
    </div>

    <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Tìm nhân viên..."
      style={{width:"100%",background:C.bg2,border:`1px solid ${C.border}`,borderRadius:10,
        padding:"10px 14px",color:C.text,fontSize:14,outline:"none",boxSizing:"border-box",marginBottom:12}}/>

    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {filtered.map(nv=>{
        const nvTh=thTuan?.[month]?.[selT]?.[nv.ma]||{};
        const nvKh=khTuan?.[month]?.[selT]?.[nv.ma]||{};
        const hasKh=KPI_CFG.some(k=>(nvKh[k.key]||0)>0);
        const hasTh=KPI_CFG.some(k=>(nvTh[k.key]??null)!==null);
        const ts=nvTh.updatedAt;
        const starKpis=KPI_CFG.filter(k=>k.star);
        const avgPct=hasKh?starKpis.filter(k=>nvKh[k.key]>0).map(k=>pct(nvTh[k.key]??0,nvKh[k.key])):[];
        const avg=avgPct.length?avgPct.reduce((a,b)=>a+(b||0),0)/avgPct.length:null;
        return <button key={nv.ma} onClick={()=>setSelNV(nv)}
          style={{background:C.bg2,border:`1px solid ${hasTh?acColor(nv.ma)+"44":hasKh?"#f59e0b33":C.border}`,
            borderRadius:14,padding:14,textAlign:"left",cursor:"pointer",width:"100%"}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{position:"relative"}}>
              <Av name={nv.ten} ma={nv.ma}/>
              {avg!==null&&<div style={{position:"absolute",bottom:-3,right:-3,background:pc(avg),
                borderRadius:"50%",width:16,height:16,border:`2px solid ${C.bg2}`,
                display:"flex",alignItems:"center",justifyContent:"center",fontSize:7,fontWeight:800,color:"#fff"}}>
                {Math.round(avg)}
              </div>}
            </div>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:13}}>{nv.ten}</div>
              {hasTh
                ? <div>
                    <div style={{display:"flex",gap:4,marginTop:4,flexWrap:"wrap"}}>
                      {starKpis.map(k=>{
                        const thV=nvTh[k.key]??null, khV=nvKh[k.key]||0;
                        const pp=khV>0?pct(thV??0,khV):null;
                        return <span key={k.key} style={{fontSize:10,background:C.bg1,borderRadius:5,
                          padding:"2px 6px",color:pp!==null?pc(pp):C.dim}}>
                          {k.icon} {fmt(thV,k.unit)} {pp!==null?`(${Math.round(pp)}%)`:""} 
                        </span>;
                      })}
                    </div>
                    {ts&&<div style={{fontSize:10,color:C.mute,marginTop:3}}>🕐 Cập nhật: {fmtTs(ts)}</div>}
                  </div>
                : <div style={{fontSize:11,color:hasKh?C.warn:C.mute,marginTop:3}}>
                    {hasKh?"Đã có KH — chưa nhập TH":"Chưa có KH tuần này"}
                  </div>}
            </div>
            <div style={{flexShrink:0}}>
              {avg!==null
                ? <Tag label={p2s(avg)} color={pc(avg)} sm/>
                : <Tag label={hasTh?"Đã nhập":hasKh?"Cần nhập":"—"} color={hasTh?C.good:hasKh?C.warn:C.mute} sm/>}
            </div>
          </div>
        </button>;
      })}
    </div>
  </div>;
}

function NhapForm({nv,selT,month,khTuan,thTuan,onSaveTh,onBack}){
  const kh=khTuan?.[month]?.[selT]?.[nv.ma]||{};
  const cur=thTuan?.[month]?.[selT]?.[nv.ma]||{};
  const hasKh=KPI_CFG.some(k=>(kh[k.key]||0)>0);
  const [vals,setVals]=useState(()=>Object.fromEntries(KPI_CFG.map(k=>[k.key,cur[k.key]??null])));
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);

  const doSave=async()=>{
    setSaving(true);
    const data = Object.fromEntries(KPI_CFG.map(k=>[k.key,n(vals[k.key])]));
    await onSaveTh(selT, nv.ma, data);
    setSaving(false); setSaved(true);
    setTimeout(()=>{setSaved(false);onBack();},1300);
  };

  return <div style={{padding:16}}>
    <button onClick={onBack} style={{background:"none",border:"none",color:C.dim,cursor:"pointer",fontSize:13,padding:0,marginBottom:14}}>
      ← Chọn lại
    </button>

    <div style={{background:`linear-gradient(135deg,#1a3050,${C.bg0})`,borderRadius:14,padding:14,marginBottom:16,border:`1px solid ${C.border}44`}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <Av name={nv.ten} ma={nv.ma} size={46}/>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:15}}>{nv.ten}</div>
          <div style={{display:"flex",gap:6,alignItems:"center",marginTop:4,flexWrap:"wrap"}}>
            <Tag label={`📅 ${selT}`} color="#3b82f6" sm/>
            <Tag label={month} color={C.dim} sm/>
            {!hasKh&&<Tag label="⚠️ Chưa có KH" color={C.bad} sm/>}
          </div>
        </div>
      </div>
    </div>

    {!hasKh&&<div style={{background:C.bad+"11",border:`1px solid ${C.bad}44`,borderRadius:12,padding:12,marginBottom:14}}>
      <div style={{fontSize:12,color:C.bad,lineHeight:1.5}}>
        NV này chưa được giao KH tuần {selT}. Anh vẫn có thể nhập TH nhưng sẽ không tính % so KH.
      </div>
    </div>}

    <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:8}}>
      {KPI_CFG.map(k=>{
        const khV=kh[k.key]||0, v=vals[k.key];
        const nv2=n(v); const p=khV>0&&nv2!==null?pct(nv2,khV):null;
        const tag=st(khV>0?p:null);
        return <div key={k.key} style={{background:C.bg2,borderRadius:14,padding:14,
          border:`1px solid ${nv2!==null?k.color+"44":C.border+"66"}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:20}}>{k.icon}</span>
              <div>
                <div style={{fontWeight:600,fontSize:14,color:k.star?C.gold:C.text}}>{k.star?"⭐ ":""}{k.label}</div>
                <div style={{fontSize:10,color:C.mute}}>KH {selT}: {khV?fmt(khV,k.unit):"Chưa giao"}</div>
              </div>
            </div>
            <Tag label={tag.l} color={tag.c} sm/>
          </div>
          <NInput value={v} onChange={val=>setVals(p=>({...p,[k.key]:val}))}
            placeholder={`TH lũy kế ${selT} — ${k.label} (${k.unit})`}
            style={{borderColor:nv2!==null?k.color+"66":undefined}}/>
          {p!==null&&khV>0&&<div style={{marginTop:8}}>
            <Bar v={nv2||0} max={khV} color={k.color} h={6}/>
            <div style={{fontSize:11,color:pc(p),marginTop:4,textAlign:"right",fontWeight:700}}>
              {p.toFixed(1)}% KH tuần
            </div>
          </div>}
        </div>;
      })}
    </div>
    <SaveBtn onSave={doSave} saving={saving} saved={saved} label={`💾 LƯU TH ${selT}`}/>
  </div>;
}

// ═══════════════════════════════════════════
// VIEW: DASHBOARD
// ═══════════════════════════════════════════
function DashView({thTuan,khTuan,khPhong,month}){
  const [scope,setScope]=useState("thang"); // thang | T1 | T2 | T3 | T4
  const [selNVs,setSelNVs]=useState([]);
  const [pickMode,setPickMode]=useState(false);
  const [detailMA,setDetailMA]=useState(null);

  const khP=khPhong[month]||DEFAULT_KH_PHONG;

  // KH & TH aggregated theo scope
  const getKhNV=ma=>{
    if(scope==="thang"){
      const o={}; KPI_CFG.forEach(k=>{o[k.key]=TUAN_LIST.reduce((s,t)=>s+(khTuan?.[month]?.[t]?.[ma]?.[k.key]||0),0)}); return o;
    }
    return khTuan?.[month]?.[scope]?.[ma]||{};
  };
  const getThNV=ma=>{
    if(scope==="thang"){
      const o={}; KPI_CFG.forEach(k=>{
        const vals=TUAN_LIST.map(t=>thTuan?.[month]?.[t]?.[ma]?.[k.key]??null).filter(v=>v!==null);
        o[k.key]=vals.length?vals.reduce((a,b)=>a+b,0):null;
      }); return o;
    }
    const d=thTuan?.[month]?.[scope]?.[ma]||{};
    return Object.fromEntries(KPI_CFG.map(k=>[k.key,d[k.key]??null]));
  };

  const getKhPhongScope=()=>{
    if(scope==="thang") return khP;
    const o={}; KPI_CFG.forEach(k=>{o[k.key]=NV_LIST.reduce((s,nv)=>s+(khTuan?.[month]?.[scope]?.[nv.ma]?.[k.key]||0),0)}); return o;
  };

  const khPS=getKhPhongScope();

  const nvData=useMemo(()=>NV_LIST.map(nv=>{
    const kh=getKhNV(nv.ma), th=getThNV(nv.ma);
    const starWithKh=KPI_CFG.filter(k=>k.star&&(kh[k.key]||0)>0);
    const score=starWithKh.length
      ? starWithKh.reduce((s,k)=>s+(pct(th[k.key]??0,kh[k.key])||0),0)/starWithKh.length
      : null;
    return {...nv,kh,th,score};
  }),[scope,thTuan,khTuan,month]);

  const totalTH=useMemo(()=>{
    const nvs=selNVs.length?nvData.filter(nv=>selNVs.includes(nv.ma)):nvData;
    const o={}; KPI_CFG.forEach(k=>{
      const vals=nvs.map(nv=>nv.th[k.key]??0);
      o[k.key]=vals.reduce((a,b)=>a+b,0);
    }); return o;
  },[nvData,selNVs]);

  const totalKH=useMemo(()=>{
    if(selNVs.length===0) return khPS;
    const o={}; KPI_CFG.forEach(k=>{
      o[k.key]=nvData.filter(nv=>selNVs.includes(nv.ma)).reduce((s,nv)=>s+(nv.kh[k.key]||0),0);
    }); return o;
  },[nvData,selNVs,khPS]);

  const ranked=[...nvData].sort((a,b)=>{
    if(a.score===null&&b.score===null)return 0;
    if(a.score===null)return 1; if(b.score===null)return -1;
    return b.score-a.score;
  });

  const toggleNV=ma=>setSelNVs(p=>p.includes(ma)?p.filter(x=>x!==ma):[...p,ma]);

  // ── DETAIL ──
  if(detailMA){
    const nv=nvData.find(x=>x.ma===detailMA);
    return <div style={{padding:16}}>
      <button onClick={()=>setDetailMA(null)} style={{background:"none",border:"none",color:C.dim,cursor:"pointer",fontSize:13,padding:0,marginBottom:14}}>
        ← Dashboard
      </button>
      <div style={{background:`linear-gradient(135deg,#1a3050,${C.bg0})`,borderRadius:14,padding:16,marginBottom:16,border:`1px solid ${C.border}44`}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <Av name={nv.ten} ma={nv.ma} size={50}/>
          <div style={{flex:1}}>
            <div style={{fontWeight:800,fontSize:16}}>{nv.ten}</div>
            <div style={{fontSize:11,color:C.dim,marginTop:2}}>Mã: {nv.ma}</div>
          </div>
          <div style={{textAlign:"right"}}>
            {nv.score!==null
              ?<><div style={{fontSize:24,fontWeight:900,color:pc(nv.score)}}>{Math.round(nv.score)}%</div>
                <Tag label={st(nv.score).l} color={pc(nv.score)} sm/></>
              :<Tag label="Chưa có KH" color={C.mute}/>}
          </div>
        </div>
      </div>

      {/* Per KPI cards */}
      {KPI_CFG.map(k=>{
        const khV=nv.kh[k.key]||0, thV=nv.th[k.key], hasKh=khV>0;
        const thShow=hasKh?(thV??0):thV;
        const p=hasKh?pct(thShow,khV):null;
        return <div key={k.key} style={{background:C.bg2,borderRadius:14,padding:14,marginBottom:10,
          border:`1px solid ${hasKh?k.color+"44":C.border+"44"}`}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:hasKh?10:0}}>
            <span style={{fontSize:20}}>{k.icon}</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:14,color:k.star?C.gold:C.text}}>{k.label}</div>
              <div style={{fontSize:10,color:C.mute}}>
                KH {scope}: {hasKh?fmt(khV,k.unit):<span style={{color:C.bad}}>Chưa giao</span>}
              </div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:20,fontWeight:800,color:hasKh?k.color:C.mute}}>
                {hasKh?fmt(thShow,k.unit):(thV!==null?fmt(thV,k.unit):"—")}
              </div>
              <Tag label={st(p).l} color={pc(p)} sm/>
            </div>
          </div>
          {hasKh&&<>
            <Bar v={thShow} max={khV} color={k.color} h={7}/>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:5}}>
              <div style={{fontSize:10,color:C.mute}}>Còn lại: {fmt(khV-(thShow||0),k.unit)}</div>
              <div style={{fontSize:11,color:pc(p),fontWeight:800}}>{p2s(p)}</div>
            </div>
          </>}
        </div>;
      })}

      {/* TH theo từng tuần */}
      <Sec title="Chi tiết theo tuần"/>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {TUAN_LIST.map(t=>{
          const khT=khTuan?.[month]?.[t]?.[nv.ma]||{};
          const thT=thTuan?.[month]?.[t]?.[nv.ma]||{};
          const hasKhT=KPI_CFG.some(k=>(khT[k.key]||0)>0);
          const hasThT=KPI_CFG.some(k=>(thT[k.key]??null)!==null);
          if(!hasKhT&&!hasThT) return null;
          return <div key={t} style={{background:C.bg1,borderRadius:12,padding:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <Tag label={t} color="#3b82f6" sm/>
              {thT.updatedAt&&<div style={{fontSize:10,color:C.mute}}>🕐 {fmtTs(thT.updatedAt)}</div>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
              {KPI_CFG.filter(k=>k.star).map(k=>{
                const khV=khT[k.key]||0, thV=thT[k.key]??null;
                const p=khV>0?pct(thV??0,khV):null;
                return <div key={k.key} style={{background:C.bg2,borderRadius:8,padding:"7px 8px",textAlign:"center"}}>
                  <div style={{fontSize:10,color:k.color,marginBottom:2}}>{k.icon}</div>
                  <div style={{fontSize:12,fontWeight:700,color:khV>0?pc(p):C.mute}}>{khV>0?fmt(thV??0,k.unit):"—"}</div>
                  <div style={{fontSize:9,color:C.mute}}>KH:{fmt(khV,k.unit)}</div>
                  {khV>0&&p!==null&&<div style={{fontSize:9,color:pc(p),fontWeight:700,marginTop:1}}>{Math.round(p)}%</div>}
                </div>;
              })}
            </div>
          </div>;
        })}
      </div>
    </div>;
  }

  // ── MAIN DASHBOARD ──
  return <div>
    <div style={{padding:"14px 16px 0"}}>

      {/* Scope selector */}
      <div style={{display:"flex",gap:5,marginBottom:12,overflowX:"auto"}}>
        {[{k:"thang",l:"📅 Cả tháng"},...TUAN_LIST.map(t=>({k:t,l:"📊 "+t}))].map(s=>(
          <button key={s.k} onClick={()=>setScope(s.k)}
            style={{padding:"7px 13px",borderRadius:20,border:"1px solid",whiteSpace:"nowrap",
              borderColor:scope===s.k?C.gold:C.border,background:scope===s.k?C.gold+"22":C.bg2,
              color:scope===s.k?C.gold:C.dim,fontSize:12,fontWeight:600,cursor:"pointer"}}>
            {s.l}
          </button>
        ))}
      </div>

      {/* NV Filter */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <div style={{fontSize:11,color:C.dim}}>
          {selNVs.length===0?"👥 Toàn phòng":`👥 ${selNVs.length} NV được chọn`}
        </div>
        <button onClick={()=>setPickMode(p=>!p)}
          style={{background:pickMode?C.gold+"22":C.bg2,border:`1px solid ${pickMode?C.gold:C.border}`,
            borderRadius:8,padding:"5px 12px",color:pickMode?C.gold:C.dim,fontSize:11,cursor:"pointer",fontWeight:600}}>
          {pickMode?"✓ Xong":"🎯 Lọc NV"}
        </button>
      </div>
      {pickMode&&<div style={{background:C.bg1,borderRadius:10,padding:10,marginBottom:10}}>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:selNVs.length?8:0}}>
          {NV_LIST.map(nv=>{
            const sel=selNVs.includes(nv.ma);
            return <button key={nv.ma} onClick={()=>toggleNV(nv.ma)}
              style={{padding:"6px 10px",borderRadius:20,border:"1px solid",fontSize:11,cursor:"pointer",
                borderColor:sel?acColor(nv.ma):C.border,background:sel?acColor(nv.ma)+"22":"transparent",
                color:sel?acColor(nv.ma):C.dim,fontWeight:sel?700:400}}>
              {sel?"✓ ":""}{nv.ten.split(" ").slice(-2).join(" ")}
            </button>;
          })}
        </div>
        {selNVs.length>0&&<button onClick={()=>setSelNVs([])}
          style={{padding:"5px 12px",borderRadius:20,border:`1px solid ${C.bad}`,
            background:C.bad+"22",color:C.bad,fontSize:11,cursor:"pointer",fontWeight:700}}>✕ Xóa lọc</button>}
      </div>}
    </div>

    {/* KPI Summary — 2 col grid */}
    <div style={{padding:"0 16px 14px"}}>
      <div style={{fontSize:11,color:C.dim,marginBottom:8,textTransform:"uppercase",letterSpacing:".09em"}}>

      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {KPI_CFG.map(k=>{
          const th=totalTH[k.key]||0, kh=totalKH[k.key]||0;
          const p=pct(th,kh);
          const gap=kh>0?Math.max(0,kh-th):null;
          return <div key={k.key} style={{background:C.bg2,borderRadius:14,padding:14,

              <div style={{position:"relative",width:44,height:44}}>
                <Ring p={kh>0?(p||0):0} size={44}/>

                  {kh>0?p2s(p):"—"}
                </div>
              </div>
            </div>
            {kh>0&&<>
              <Bar v={th} max={kh} color={k.color} h={5}/>
              {gap!==null&&gap>0&&<div style={{fontSize:9,color:C.bad,marginTop:4,fontWeight:600}}>
                ▼ GAP: {fmt(gap,k.unit)}
              </div>}
            </>}
          </div>;

      </div>
    </div>

    {/* Ranking */}
    <div style={{padding:"0 16px 16px"}}>
      <div style={{fontSize:11,color:C.dim,marginBottom:8,textTransform:"uppercase",letterSpacing:".09em"}}>🏆 Xếp hạng nhân viên</div>
      {ranked.filter(nv=>selNVs.length===0||selNVs.includes(nv.ma)).map((nv,i)=>{
        const hasKh=KPI_CFG.filter(k=>k.star).some(k=>(nv.kh[k.key]||0)>0);
        const tag=st(hasKh?(nv.score??0):null);
        return <button key={nv.ma} onClick={()=>setDetailMA(nv.ma)}
          style={{background:C.bg2,border:`1px solid ${C.border}33`,borderRadius:14,
            padding:"13px 14px",textAlign:"left",cursor:"pointer",width:"100%",marginBottom:8,display:"block"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>

              background:i===0?"#f59e0b22":i===1?"#94a3b822":i===2?"#d9770622":C.bg1,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800,
              color:i===0?C.gold:i===1?"#94a3b8":i===2?"#d97706":C.mute}}>{i+1}</div>
            <Av name={nv.ten} ma={nv.ma} size={36}/>
            <div style={{flex:1,overflow:"hidden"}}>
              <div style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nv.ten}</div>
              <div style={{display:"flex",gap:4,marginTop:4,flexWrap:"wrap"}}>

                  const khV=nv.kh[k.key]||0, thV=nv.th[k.key];
                  const p=khV>0?pct(thV??0,khV):null;

              <div style={{fontSize:18,fontWeight:800,color:hasKh?pc(nv.score??0):C.mute}}>
                {hasKh?p2s(nv.score??0):"—"}
              </div>
              <Tag label={tag.l} color={tag.c} sm/>
            </div>
          </div>
        </button>;
      })}
    </div>
  </div>;
}

function AlertView({thTuan,khTuan,khPhong,month}){
  const khP=khPhong[month]||DEFAULT_KH_PHONG;

  // Tổng TH tháng
  const totalTH=useMemo(()=>{
    const o={}; KPI_CFG.forEach(k=>{
      o[k.key]=NV_LIST.reduce((s,nv)=>
        s+TUAN_LIST.reduce((s2,t)=>s2+(thTuan?.[month]?.[t]?.[nv.ma]?.[k.key]??0),0)
      ,0);
    }); return o;
  },[thTuan,month]);

  // NV chưa có TH tuần này (tuần hiện tại)
  const curDay=new Date().getDate();
  const curTuan=curDay<=7?"T1":curDay<=14?"T2":curDay<=21?"T3":"T4";
  const chuaNhap=NV_LIST.filter(nv=>{
    const hasKh=KPI_CFG.some(k=>(khTuan?.[month]?.[curTuan]?.[nv.ma]?.[k.key]||0)>0);
    const hasTh=KPI_CFG.some(k=>(thTuan?.[month]?.[curTuan]?.[nv.ma]?.[k.key]??null)!==null);
    return hasKh&&!hasTh;
  });
  const chuaCoKh=NV_LIST.filter(nv=>!KPI_CFG.some(k=>(khTuan?.[month]?.[curTuan]?.[nv.ma]?.[k.key]||0)>0));

  const kpiWarn=KPI_CFG.map(k=>{
    const p=pct(totalTH[k.key],khP[k.key]);
    return {...k,th:totalTH[k.key],p};
  }).filter(k=>k.p!==null&&k.p<70);

  return <div style={{padding:16}}>
    <Sec title={`🚨 Cảnh báo · ${curTuan} · ${month}`}/>

    {/* Nhập TH */}
    <div style={{background:C.bg2,borderRadius:14,padding:14,marginBottom:12,
      border:`1px solid ${chuaNhap.length?C.bad:C.good}44`}}>
      <div style={{fontWeight:700,fontSize:14,color:chuaNhap.length?C.bad:C.good,marginBottom:chuaNhap.length?10:0}}>
        {chuaNhap.length?`🚨 ${chuaNhap.length} NV có KH nhưng chưa nhập TH (${curTuan})`:"✅ Tất cả NV có KH đã nhập TH"}
      </div>
      {chuaNhap.map(nv=><div key={nv.ma} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderTop:`1px solid ${C.bg1}`}}>
        <Av name={nv.ten} ma={nv.ma} size={32}/>
        <div style={{flex:1}}>
          <div style={{fontSize:13,fontWeight:600}}>{nv.ten}</div>
          <div style={{fontSize:10,color:C.mute}}>Đã có KH — chưa nhập TH {curTuan}</div>
        </div>
        <Tag label="Cần nhập" color={C.warn} sm/>
      </div>)}
    </div>

    {/* Chưa có KH */}
    {chuaCoKh.length>0&&<div style={{background:C.bg2,borderRadius:14,padding:14,marginBottom:12,
      border:`1px solid ${C.warn}44`}}>
      <div style={{fontWeight:700,fontSize:14,color:C.warn,marginBottom:10}}>
        ⚠️ {chuaCoKh.length} NV chưa được giao KH {curTuan}
      </div>
      {chuaCoKh.map(nv=><div key={nv.ma} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderTop:`1px solid ${C.bg1}`}}>
        <Av name={nv.ten} ma={nv.ma} size={30}/>
        <span style={{fontSize:13,fontWeight:600}}>{nv.ten}</span>
      </div>)}
    </div>}

    {/* KPI phòng dưới ngưỡng */}
    {kpiWarn.length>0&&<>
      <Sec title="KPI phòng cần đẩy mạnh (dưới 70%)"/>
      {kpiWarn.map(k=><div key={k.key} style={{background:C.bg2,borderRadius:14,padding:14,marginBottom:10,
        border:`1px solid ${C.bad}33`}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
          <span style={{fontSize:22}}>{k.icon}</span>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:14,color:k.star?C.gold:C.text}}>{k.label}</div>
            <div style={{fontSize:11,color:C.mute}}>TH: {fmt(k.th,k.unit)} / KH: {fmt(khP[k.key],k.unit)}</div>
          </div>
          <Tag label={p2s(k.p)} color={pc(k.p)}/>
        </div>
        <Bar v={k.th} max={khP[k.key]} color={pc(k.p)} h={7}/>
      </div>)}
    </>}
  </div>;
}

    const hasKh=KPI_CFG.some(k=>(khTuan?.[month]?.[curTuan]?.[nv.ma]?.[k.key]||0)>0);

  }).length;

  if(loading) return <div style={{minHeight:"100vh",background:C.bg0,display:"flex",flexDirection:"column",

    <div style={{color:C.gold,fontSize:16,fontWeight:700}}>KPI Banking</div>
    <div style={{color:C.dim,fontSize:12}}>Đang tải dữ liệu...</div>
    {hasRemote()&&<div style={{color:C.mute,fontSize:11}}>🔄 Đồng bộ Google Sheets...</div>}

  const TABS=[
    {k:"nhap", ic:"✏️", lb:"Nhập TH"},
    {k:"kh",   ic:"🎯", lb:"Giao KH"},

      {tab==="alert"&&<AlertView thTuan={thTuan} khTuan={khTuan} khPhong={khPhong} month={month}/>}
      {tab==="setup"&&<SetupView onBack={()=>setTab("nhap")}/>}

    {/* BOTTOM NAV */}
    <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",

            borderRadius:"50%",background:C.bad,fontSize:9,fontWeight:800,color:"#fff",
            display:"flex",alignItems:"center",justifyContent:"center"}}>{t.badge}</div>}
          <div style={{fontSize:19,marginBottom:2}}>{t.ic}</div>
          <div>{t.lb}</div>
        </button>
      ))}
    </div>
  </div>;
  useEffect(()=>{
    loadData();
    // Firebase SSE realtime listeners
    var listeners = [];
    function startListeners() {
      [
        [DB_ROOT_PATH+"/khPhong/"+month, (v)=>{ if(v) setKhPhong(p=>({...p,[month]:v})); }],
        [DB_ROOT_PATH+"/khTuan/"+month,  (v)=>{ if(v) setKhTuan(p=>({...p,[month]:v})); }],
        [DB_ROOT_PATH+"/thTuan/"+month,  (v)=>{ if(v){ setThTuan(p=>({...p,[month]:v})); setOnline(true); }}],
      ].forEach(([path, cb])=>{
        try {
          var es = new EventSource(DB_URL+"/"+path+".json?accept=text/event-stream");
          es.addEventListener("put", function(e){
            try{ var d=JSON.parse(e.data); if(d&&d.data!==null) cb(d.data); }catch(err){}
          });
          listeners.push(es);
        } catch(err) {}
      });
    }
    startListeners();
    return () => listeners.forEach(es => es.close());

// ═══════════════════════════════════════════
// FIREBASE REST API — data layer
// ═══════════════════════════════════════════
var DB_URL  = "https://kpi-banking-nab-default-rtdb.asia-southeast1.firebasedatabase.app";
var DB_ROOT_PATH = "kpi_banking";

async function fbGet(path) {
  try {
    var r = await fetch(DB_URL + "/" + path + ".json");
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

async function fbSet(path, data) {
  try {
    await fetch(DB_URL + "/" + path + ".json", {
      method: "PUT",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(data)
    });
  } catch(e) { console.warn("fbSet:", e.message); }
}

async function loadAllData(month) {
  try {
    var [d1, d2, d3] = await Promise.all([
      fbGet(DB_ROOT_PATH + "/khPhong/" + month),
      fbGet(DB_ROOT_PATH + "/khTuan/"  + month),
      fbGet(DB_ROOT_PATH + "/thTuan/"  + month),
    ]);
    return {
      khPhong: d1 ? {[month]: d1} : {},
      khTuan:  d2 ? {[month]: d2} : {},
      thTuan:  d3 ? {[month]: d3} : {},
      online: !!(d1 || d2 || d3),
    };
  } catch(e) {
    return { khPhong:{}, khTuan:{}, thTuan:{}, online:false };
  }
}

async function saveKhPhongData(month, data, cur) {
  const next = {...cur, [month]: {...data}};
  fbSet(DB_ROOT_PATH + "/khPhong/" + month, data);
  return next;
}

async function saveKhTuanData(month, tuan, ma_nv, data, cur) {
  const next = JSON.parse(JSON.stringify(cur));
  if(!next[month]) next[month]={};
  if(!next[month][tuan]) next[month][tuan]={};
  next[month][tuan][ma_nv] = {...data};
  fbSet(DB_ROOT_PATH + "/khTuan/" + month + "/" + tuan + "/" + ma_nv, data);
  return next;
}

async function saveThTuanData(month, tuan, ma_nv, data, cur) {
  const next = JSON.parse(JSON.stringify(cur));
  if(!next[month]) next[month]={};
  if(!next[month][tuan]) next[month][tuan]={};
  const record = {...data, updatedAt: Date.now()};
  next[month][tuan][ma_nv] = record;
  fbSet(DB_ROOT_PATH + "/thTuan/" + month + "/" + tuan + "/" + ma_nv, record);
  return next;
}

// UTILS
// ═══════════════════════════════════════════
const n = v => (v===null||v===undefined||v===""||isNaN(+v)) ? null : +v;
const fmt = (v,u="") => { const x=n(v); return x===null?"—":x.toLocaleString("vi-VN")+(u?" "+u:""); };
const pct = (th,kh) => (kh&&kh>0&&th!==null) ? th/kh*100 : null;
const p2s = p => p===null?"—":Math.round(p)+"%";

const C = {
  good:"#10b981", warn:"#f59e0b", low:"#f97316", bad:"#ef4444", mute:"#475569",
  bg0:"#050d1a", bg1:"#0a1628", bg2:"#111f35", bg3:"#1a2e48",
  border:"#1e3a5f", gold:"#f59e0b", text:"#e2e8f0", dim:"#94a3b8",
};
const pc = p => p===null?C.mute:p>=100?C.good:p>=70?C.warn:p>=40?C.low:C.bad;
const st = p => p===null?{l:"Chưa có KH",c:C.mute}:p>=100?{l:"✅ Đạt",c:C.good}:p>=70?{l:"⚡ Khá",c:C.warn}:p>=40?{l:"⚠️ Trung bình",c:C.low}:{l:"🚨 Cần đẩy",c:C.bad};

const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const acChar = name => name.split(" ").pop()[0]||"?";
const acColor = ma => { const cols=["#f59e0b","#3b82f6","#8b5cf6","#10b981","#ec4899","#06b6d4","#f97316","#a855f7"]; let h=0; for(let i=0;i<ma.length;i++)h=(h*31+ma.charCodeAt(i))%cols.length; return cols[h]; };
const fmtTs = ts => { if(!ts)return"—"; const d=new Date(ts); return `${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

// Deep clone
const clone = v => JSON.parse(JSON.stringify(v));

// ═══════════════════════════════════════════
// UI ATOMS
// ═══════════════════════════════════════════
function Bar({v=0,max=0,color,h=6}){
  const w=max>0?Math.min(100,Math.max(0,v/max*100)):0;
  return <div style={{background:"#08111e",borderRadius:h,height:h,overflow:"hidden"}}>
    <div style={{width:`${w}%`,height:"100%",background:color,borderRadius:h,transition:"width .5s"}}/>
  </div>;
}

function Ring({p=0,size=50,sw=6}){
  const r=(size-sw*2)/2, c2=2*Math.PI*r, val=Math.min(Math.max(p||0,0),100);
  return <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#08111e" strokeWidth={sw}/>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={pc(p)} strokeWidth={sw}
      strokeDasharray={`${val/100*c2} ${c2}`} strokeLinecap="round" style={{transition:"stroke-dasharray .6s"}}/>
  </svg>;
}

function Av({name,ma,size=38}){
  const ac=acColor(ma);
  return <div style={{width:size,height:size,borderRadius:"50%",background:ac+"1a",border:`1.5px solid ${ac}55`,
    display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*.38,fontWeight:800,color:ac,flexShrink:0}}>
    {acChar(name)}
  </div>;
}

function Tag({label,color,bg,sm}){
  return <span style={{background:bg||color+"22",color,borderRadius:6,padding:sm?"2px 7px":"4px 11px",
    fontSize:sm?10:12,fontWeight:700,whiteSpace:"nowrap"}}>{label}</span>;
}

function Card({ch,style={}}){
  return <div style={{background:C.bg2,borderRadius:14,padding:16,border:`1px solid ${C.border}22`,...style}}>{ch}</div>;
}

function Sec({title,sub}){
  return <div style={{marginBottom:10}}>
    <div style={{fontSize:11,color:C.dim,textTransform:"uppercase",letterSpacing:".1em",fontWeight:700}}>{title}</div>
    {sub&&<div style={{fontSize:12,color:C.mute,marginTop:2}}>{sub}</div>}
  </div>;
}

function NInput({value,onChange,placeholder,style={}}){
  return <input type="number" inputMode="decimal" value={value??""} onChange={e=>onChange(e.target.value)}
    placeholder={placeholder} style={{width:"100%",background:C.bg1,border:`1px solid ${C.border}`,borderRadius:10,
      padding:"12px 13px",color:C.text,fontSize:16,outline:"none",boxSizing:"border-box",fontWeight:600,...style}}/>;
}

function SaveBtn({onSave,saving,saved,label}){
  return <button onClick={onSave} disabled={saving||saved}
    style={{width:"100%",padding:16,borderRadius:14,border:"none",cursor:"pointer",marginTop:8,
      background:saved?"#10b981":`linear-gradient(135deg,${C.gold},#d97706)`,
      color:"#040a12",fontWeight:800,fontSize:16,transition:"all .3s"}}>
    {saved?"✅ ĐÃ LƯU!":saving?"⏳ Đang lưu...":label}
  </button>;
}

    <SaveBtn onSave={save} saving={saving} saved={saved} label="💾 LƯU KH PHÒNG"/>

}

// ═══════════════════════════════════════════
// VIEW: GIAO KH TUẦN (phân bổ cho NV)
// ═══════════════════════════════════════════
function KhTuanView({khPhong,khTuan,onSaveKh,month,thTuan}){
  const [selT,setSelT] = useState("T1");
  const [selNV,setSelNV] = useState(null);
  const [vals,setVals] = useState({});
  const [saved,setSaved] = useState(false);
  const [view,setView] = useState("list"); // list | form | overview

  const khP = khPhong[month]||DEFAULT_KH_PHONG;

  // Tổng KH đã giao trong tháng per KPI (tất cả tuần)
  const sumGiaoThang = (ma,kk) => TUAN_LIST.reduce((s,t)=>s+(khTuan?.[month]?.[t]?.[ma]?.[kk]||0),0);
  const sumGiaoPhong = kk => NV_LIST.reduce((s,nv)=>s+sumGiaoThang(nv.ma,kk),0);

  const tuanData = khTuan?.[month]?.[selT]||{};

  const openForm = nv => {
    setVals(Object.fromEntries(KPI_CFG.map(k=>[k.key,tuanData[nv.ma]?.[k.key]??null])));
    setSelNV(nv); setView("form");
  };

  const doSave = async()=>{
    // Validate không vượt KH phòng
    const errs=[];
    KPI_CFG.forEach(k=>{
      const newV=n(vals[k.key])||0, oldV=tuanData[selNV.ma]?.[k.key]||0;
      const giaoPhongExcl=sumGiaoPhong(k.key)-sumGiaoThang(selNV.ma,k.key);
      const nvSumExcl=sumGiaoThang(selNV.ma,k.key)-oldV;
      if(giaoPhongExcl+nvSumExcl+newV>(khP[k.key]||0)) errs.push(k.label);
    });
    if(errs.length){ alert(`⚠️ Vượt KH tháng phòng:\n${errs.join(", ")}`); return; }
    const data = Object.fromEntries(KPI_CFG.map(k=>[k.key,n(vals[k.key])||0]));
    await onSaveKh(selT, selNV.ma, data);
    setSaved(true); setTimeout(()=>{setSaved(false);setView("list");setSelNV(null);},1200);
  };

  // ── OVERVIEW ──
  if(view==="overview") return <div style={{padding:16}}>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
      <button onClick={()=>setView("list")} style={{background:"none",border:"none",color:C.dim,cursor:"pointer",fontSize:14,padding:0}}>←</button>
      <div style={{fontWeight:700,color:C.gold,fontSize:15}}>{selT} — Tổng quan KH vs TH</div>
    </div>
    {KPI_CFG.map(k=>{
      const giaoPhong=sumGiaoPhong(k.key), khPV=khP[k.key]||0;
      const p=pct(giaoPhong,khPV);
      return <div key={k.key} style={{background:C.bg2,borderRadius:14,padding:14,marginBottom:10,border:`1px solid ${k.color}33`}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
          <span style={{fontSize:19}}>{k.icon}</span>
          <div style={{fontWeight:700,fontSize:13,color:k.star?C.gold:C.text,flex:1}}>{k.label}</div>
          <div style={{fontSize:12,textAlign:"right"}}>
            <span style={{color:pc(p),fontWeight:800}}>{fmt(giaoPhong,k.unit)}</span>
            <span style={{color:C.mute}}> / {fmt(khPV,k.unit)}</span>
          </div>
        </div>
        <Bar v={giaoPhong} max={khPV} color={k.color}/>
        <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:5}}>
          {NV_LIST.map(nv=>{
            const kh=tuanData[nv.ma]?.[k.key]||0;
            const th=thTuan?.[month]?.[selT]?.[nv.ma]?.[k.key]??null;
            if(!kh&&th===null) return null;
            const pp=pct(th??0,kh);
            return <div key={nv.ma} style={{display:"flex",alignItems:"center",gap:8,background:C.bg1,borderRadius:8,padding:"7px 10px"}}>
              <Av name={nv.ten} ma={nv.ma} size={26}/>
              <div style={{flex:1,overflow:"hidden"}}>
                <div style={{fontSize:12,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {nv.ten.split(" ").slice(-2).join(" ")}
                </div>
                <div style={{fontSize:10,color:C.mute}}>KH: {fmt(kh,k.unit)}</div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontWeight:700,fontSize:12,color:kh?pc(pp):C.mute}}>{kh?fmt(th??0,k.unit):"—"}</div>
                {kh>0&&<Tag label={p2s(pp)} color={pc(pp)} sm/>}
              </div>
            </div>;
          })}
        </div>
      </div>;
    })}
  </div>;

  // ── FORM ──
  if(view==="form"&&selNV) return <div style={{padding:16}}>
    <button onClick={()=>setView("list")} style={{background:"none",border:"none",color:C.dim,cursor:"pointer",fontSize:13,padding:0,marginBottom:14}}>
      ← Danh sách
    </button>
    <div style={{background:`linear-gradient(135deg,#1a3050,${C.bg0})`,borderRadius:14,padding:14,marginBottom:16,border:`1px solid ${C.border}44`}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <Av name={selNV.ten} ma={selNV.ma} size={46}/>
        <div>
          <div style={{fontWeight:700,fontSize:15}}>{selNV.ten}</div>
          <div style={{fontSize:11,color:C.dim}}>Giao KH {selT} · {month}</div>
        </div>
      </div>
    </div>
    {KPI_CFG.map(k=>{
      const newV=n(vals[k.key])||0, oldV=tuanData[selNV.ma]?.[k.key]||0;
      const giaoExcl=sumGiaoPhong(k.key)-sumGiaoThang(selNV.ma,k.key);
      const nvExcl=sumGiaoThang(selNV.ma,k.key)-oldV;
      const conPhong=(khP[k.key]||0)-giaoExcl-nvExcl-newV;
      const warn=conPhong<0;
      const th=thTuan?.[month]?.[selT]?.[selNV.ma]?.[k.key]??null;
      const pp=pct(th??0,newV);
      return <div key={k.key} style={{background:C.bg2,borderRadius:14,padding:14,marginBottom:10,
        border:`1px solid ${warn?C.bad:k.color}33`}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
          <span style={{fontSize:20}}>{k.icon}</span>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:14,color:k.star?C.gold:C.text}}>{k.star?"⭐ ":""}{k.label}</div>
            <div style={{fontSize:10,color:warn?C.bad:C.mute}}>
              Còn lại phòng: <b style={{color:warn?C.bad:C.good}}>{fmt(conPhong,k.unit)}</b>
              {warn&&" — Vượt!"}
            </div>
          </div>
          {newV>0&&th!==null&&<Tag label={`TH: ${fmt(th,k.unit)}`} color={pc(pp)} sm/>}
        </div>
        <NInput value={vals[k.key]} onChange={v=>setVals(p=>({...p,[k.key]:v}))}
          placeholder={`KH ${selT} — ${k.label} (${k.unit})`}
          style={{borderColor:warn?"#ef444466":undefined}}/>
        {newV>0&&<div style={{marginTop:8}}>
          <Bar v={newV} max={khP[k.key]} color={k.color}/>
          <div style={{fontSize:10,color:C.mute,marginTop:3,textAlign:"right"}}>
            {p2s(pct(newV,khP[k.key]))} KH tháng phòng
          </div>
        </div>}
      </div>;
    })}
    <SaveBtn onSave={doSave} saving={false} saved={saved} label="💾 GIAO KẾ HOẠCH"/>
  </div>;

  // ── LIST ──
  return <div style={{padding:16}}>
    <Sec title={`📋 Kế hoạch tuần · ${month}`} sub="Phân bổ chỉ tiêu tuần cho từng nhân viên"/>

    {/* Tuần selector */}
    <div style={{display:"flex",gap:6,marginBottom:14}}>
      {TUAN_LIST.map(t=><button key={t} onClick={()=>setSelT(t)}
        style={{flex:1,padding:"10px 0",borderRadius:10,border:"1px solid",
          borderColor:selT===t?"#3b82f6":C.border,background:selT===t?"#3b82f622":C.bg2,
          color:selT===t?"#3b82f6":C.dim,fontWeight:700,fontSize:14,cursor:"pointer"}}>{t}</button>)}
    </div>

    {/* KH còn lại phòng */}
    <div style={{overflowX:"auto",marginBottom:14}}>
      <div style={{display:"flex",gap:6,width:"max-content",paddingBottom:2}}>
        {KPI_CFG.map(k=>{
          const con=(khP[k.key]||0)-sumGiaoPhong(k.key), warn=con<0;
          return <div key={k.key} style={{background:C.bg1,borderRadius:10,padding:"8px 12px",
            border:`1px solid ${warn?C.bad:k.color}22`,textAlign:"center",minWidth:80}}>
            <div style={{fontSize:10,color:k.color,marginBottom:2}}>{k.icon} {k.short}</div>
            <div style={{fontSize:13,fontWeight:800,color:warn?C.bad:C.text}}>{fmt(con,k.unit)}</div>
            <div style={{fontSize:9,color:C.mute}}>còn phân bổ</div>
          </div>;
        })}
      </div>
    </div>

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <div style={{fontSize:12,color:C.dim}}>Bấm vào NV để giao KH {selT}</div>
      <button onClick={()=>setView("overview")}
        style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:8,
          padding:"6px 12px",color:C.gold,fontSize:12,cursor:"pointer",fontWeight:600}}>📊 Tổng quan</button>
    </div>

    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {NV_LIST.map(nv=>{
        const nvKh=tuanData[nv.ma]||{};
        const hasKh=KPI_CFG.some(k=>(nvKh[k.key]||0)>0);
        const starTH=KPI_CFG.filter(k=>k.star).map(k=>({k,th:thTuan?.[month]?.[selT]?.[nv.ma]?.[k.key]??null,kh:nvKh[k.key]||0}));
        return <button key={nv.ma} onClick={()=>openForm(nv)}
          style={{background:C.bg2,border:`1px solid ${hasKh?C.gold+"44":C.border}`,
            borderRadius:14,padding:14,textAlign:"left",cursor:"pointer",width:"100%"}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <Av name={nv.ten} ma={nv.ma}/>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:13}}>{nv.ten}</div>
              {hasKh
                ? <div style={{display:"flex",gap:4,marginTop:5,flexWrap:"wrap"}}>
                    {starTH.map(({k,th,kh})=>{
                      const pp=kh>0?pct(th??0,kh):null;
                      return <span key={k.key} style={{fontSize:10,background:C.bg1,borderRadius:5,
                        padding:"2px 6px",color:pp!==null?pc(pp):C.dim}}>
                        {k.icon} KH:{fmt(kh,k.unit)} TH:{kh?fmt(th??0,k.unit):"—"}
                      </span>;
                    })}
                  </div>
                : <div style={{fontSize:11,color:C.mute,marginTop:3}}>Chưa giao KH {selT}</div>}
            </div>
            <span style={{color:hasKh?C.gold:C.mute,fontSize:20}}>›</span>
          </div>
        </button>;
      })}
    </div>
  </div>;
}
