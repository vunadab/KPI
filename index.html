function buildReport(m, scope) {
  var kp = gKP(m);
  var tuans = scope === 'thang' ? ['T1','T2','T3','T4'] : [scope];
  var fnvs = filteredNVs();
  var totalTH = {};
  KPIS.forEach(function(k) { totalTH[k.key] = fnvs.reduce(function(s,nv){return s+tuans.reduce(function(s2,t){return s2+(gTH(m,t,nv.ma)[k.key]||0);},0);},0); });
  var nvData = fnvs.map(function(nv) {
    var kh={},th={};
    KPIS.forEach(function(k){kh[k.key]=tuans.reduce(function(s,t){return s+(gKT(m,t,nv.ma)[k.key]||0);},0);th[k.key]=tuans.reduce(function(s,t){return s+(gTH(m,t,nv.ma)[k.key]||0);},0);});
    var wk=STARS.filter(function(k){return(kh[k.key]||0)>0;});
    var score=wk.length?wk.reduce(function(s,k){return s+(pct(th[k.key]||0,kh[k.key])||0);},0)/wk.length:null;
    return{nv:nv,kh:kh,th:th,score:score};
  }).sort(function(a,b){if(a.score===null&&b.score===null)return 0;if(a.score===null)return 1;if(b.score===null)return-1;return b.score-a.score;});

  var now=new Date();
  var dateStr=now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear()+' '+('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);
  var p1=m.split('-'), monthLabel='Tháng '+(+p1[1])+'/'+p1[0];
  var scopeLabel=scope==='thang'?'Cả tháng':scope;
  var nvLabel=S.filterNVs.length>0?S.filterNVs.length+' NV được chọn':'Toàn phòng ('+NVS.length+' NV)';

  var kpiCards=KPIS.map(function(k){var th=totalTH[k.key]||0,kh=kp[k.key]||0,p=pct(th,kh),w=kh>0?Math.min(100,Math.max(0,th/kh*100)):0,pc2=p===null?'#aaa':p>=100?'#00c48c':p>=70?'#e8a020':p>=40?'#ff9f43':'#ff4757';return'<div style="flex:1;min-width:110px;background:#f8faff;border:1px solid '+(kh>0?k.color+'40':'#e0e8ff')+';border-radius:11px;padding:11px 12px"><div style="font-size:12px;margin-bottom:3px">'+k.icon+' <b style="color:#1a2e4a">'+k.label+'</b>'+(k.star?' <span style="color:#e8a020;font-size:10px">⭐</span>':'')+'</div><div style="font-size:18px;font-weight:900;color:'+(kh>0?k.color:'#aaa')+';font-family:monospace">'+fmt(th,k.unit)+'</div><div style="font-size:10px;color:#888;margin-top:1px">KH: '+(kh>0?fmt(kh,k.unit):'—')+'</div><div style="margin-top:5px;background:#e8eef8;border-radius:3px;height:5px;overflow:hidden"><div style="width:'+w+'%;height:5px;background:'+pc2+';border-radius:3px"></div></div><div style="font-size:12px;font-weight:800;color:'+pc2+';margin-top:3px">'+(kh>0?p2s(p):'—')+'</div></div>';}).join('');

  var thHead=STARS.map(function(k){return'<th style="padding:8px 9px;color:#fff;font-size:10px;font-weight:700;text-align:center;white-space:nowrap">'+k.icon+' '+k.label+'</th>';}).join('');
  var nvRows=nvData.map(function(d,i){var rankIco=['🥇','🥈','🥉'][i]||(i+1)+'.';var st2=stl(d.score);var bg=i%2===0?'#fafbff':'#fff';var starCols=STARS.map(function(k){var kh=d.kh[k.key]||0,th=d.th[k.key]||0,p2=pct(th,kh),pc3=p2===null?'#aaa':p2>=100?'#00c48c':p2>=70?'#e8a020':p2>=40?'#ff9f43':'#ff4757';return'<td style="padding:8px 9px;text-align:center"><div style="font-weight:700;font-family:monospace;font-size:11px;color:#1a3a6e">'+(kh>0?fmt(th,k.unit):'—')+'</div><div style="font-size:9px;font-weight:700;color:'+pc3+'">'+(kh>0?p2s(p2):'')+'</div></td>';}).join('');var scoreBg=d.score===null?'#f0f0f0':d.score>=100?'#e6f9f3':d.score>=70?'#fef9ec':d.score>=40?'#fff4e6':'#fff0f1';return'<tr style="background:'+bg+'"><td style="padding:8px 11px;text-align:center;font-size:14px">'+rankIco+'</td><td style="padding:8px 11px;font-weight:700;color:#1a1a2e;font-size:12px">'+d.nv.ten+'</td>'+starCols+'<td style="padding:8px 11px;text-align:center"><span style="background:'+scoreBg+';color:'+st2.c+';font-weight:800;padding:3px 9px;border-radius:5px;font-size:12px">'+(d.score!==null?p2s(d.score):'—')+'</span></td></tr>';}).join('');

  var chuaNhap2=NVS.filter(function(nv){return tuans.some(function(t){var kh=gKT(m,t,nv.ma),th=gTH(m,t,nv.ma);return KPIS.some(function(k){return(kh[k.key]||0)>0;})&&!KPIS.some(function(k){return th[k.key]!=null;});});});
  var duoi502=NVS.filter(function(nv){return STARS.some(function(k){var kh=tuans.reduce(function(s,t){return s+(gKT(m,t,nv.ma)[k.key]||0);},0),th=tuans.reduce(function(s,t){return s+(gTH(m,t,nv.ma)[k.key]||0);},0);return kh>0&&th>0&&pct(th,kh)<50;});});
  var warnHtml2='';
  if(chuaNhap2.length)warnHtml2+='<div style="background:#fff0f1;border-left:4px solid #ff4757;padding:9px 13px;border-radius:0 7px 7px 0;margin-bottom:7px"><div style="font-weight:700;color:#c0392b;margin-bottom:3px">🚨 '+chuaNhap2.length+' NV có KH chưa nhập TH</div><div style="font-size:11px;color:#666">'+chuaNhap2.map(function(nv){return nv.ten;}).join(' · ')+'</div></div>';
  if(duoi502.length)warnHtml2+='<div style="background:#fff8e6;border-left:4px solid #ff9f43;padding:9px 13px;border-radius:0 7px 7px 0;margin-bottom:7px"><div style="font-weight:700;color:#d35400;margin-bottom:3px">⚠️ '+duoi502.length+' NV dưới 50% KPI trọng điểm</div><div style="font-size:11px;color:#666">'+duoi502.map(function(nv){return nv.ten;}).join(' · ')+'</div></div>';
  if(!warnHtml2)warnHtml2='<div style="background:#e8f9f3;border-left:4px solid #00c48c;padding:9px 13px;border-radius:0 7px 7px 0"><div style="font-weight:700;color:#00a878">✅ Không có cảnh báo — Phòng đang kiểm soát tốt</div></div>';

  // Pipeline summary
  var allDeals2=getAllDeals(m);
  var plByStage=PL_STAGES.map(function(st){var cnt=allDeals2.filter(function(d){return d.gd===st.key;}).length,val=plTotalValue(allDeals2.filter(function(d){return d.gd===st.key;}));return st.label+': <b>'+cnt+' deal</b>'+(val>0?' ('+fmt(val,'tr đ')+')':'');}).join(' · ');
  var plHtml=allDeals2.length?'<div style="margin-bottom:20px"><div style="font-size:10px;font-weight:800;color:#1a3a6e;text-transform:uppercase;letter-spacing:.09em;margin-bottom:9px;padding-bottom:4px;border-bottom:2px solid #e8eef8">📋 IV. PIPELINE THÁNG</div><div style="font-size:12px;color:#444;margin-bottom:8px">Tổng '+allDeals2.length+' deals · '+fmt(plTotalValue(allDeals2),'tr đ')+' tổng giá trị</div><div style="font-size:11px;color:#666;line-height:1.8">'+plByStage+'</div></div>':'';

  return '<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><style>'
    +'*{margin:0;padding:0;box-sizing:border-box;}'
    +'body{font-family:Arial,sans-serif;background:#fff;color:#1a1a2e;font-size:12px;}'
    +'.page{width:794px;margin:0 auto;padding:34px 38px;}'
    +'table{width:100%;border-collapse:collapse;}'
    +'thead tr{background:linear-gradient(135deg,#1a3a6e,#2d5aac);}'
    +'tbody tr:nth-child(even){background:#f8faff;}'
    +'tbody td{border-bottom:1px solid #eef0f8;}'
    +'</style></head><body><div class="page">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:3px solid #1a3a6e;margin-bottom:20px">'
    +'<div style="display:flex;align-items:center;gap:12px"><div style="width:46px;height:46px;background:linear-gradient(135deg,#e8a020,#ffc84a);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px">🏦</div>'
    +'<div><div style="font-size:19px;font-weight:900;color:#1a3a6e">Nam A Bank</div><div style="font-size:10px;color:#888;margin-top:2px;letter-spacing:.05em;text-transform:uppercase">Phòng Khách hàng cá nhân</div></div></div>'
    +'<div style="text-align:right"><div style="font-size:15px;font-weight:800;color:#1a3a6e">📊 BÁO CÁO KPI</div>'
    +'<div style="font-size:12px;color:#666;margin-top:2px">'+monthLabel+' · '+scopeLabel+'</div>'
    +'<div style="font-size:11px;color:#aaa;margin-top:1px">'+nvLabel+'</div>'
    +'<div style="font-size:10px;color:#ccc;margin-top:2px">Xuất: '+dateStr+'</div>'
    +'<div style="margin-top:6px;display:inline-block;background:#fff8e6;border:1px solid #e8a020;border-radius:4px;padding:2px 9px;font-size:9px;font-weight:700;color:#e8a020">🔒 NỘI BỘ</div></div></div>'
    +'<div style="margin-bottom:20px"><div style="font-size:10px;font-weight:800;color:#1a3a6e;text-transform:uppercase;letter-spacing:.09em;margin-bottom:9px;padding-bottom:4px;border-bottom:2px solid #e8eef8">📈 I. TỔNG QUAN KPI</div>'
    +'<div style="display:flex;gap:7px;flex-wrap:wrap">'+kpiCards+'</div></div>'
    +'<div style="margin-bottom:20px"><div style="font-size:10px;font-weight:800;color:#1a3a6e;text-transform:uppercase;letter-spacing:.09em;margin-bottom:9px;padding-bottom:4px;border-bottom:2px solid #e8eef8">🏆 II. KẾT QUẢ TỪNG NV</div>'
    +'<table><thead><tr><th style="padding:8px 11px;color:#fff;font-size:10px;font-weight:700;width:32px;text-align:center">#</th><th style="padding:8px 11px;color:#fff;font-size:10px;font-weight:700;text-align:left">Họ và tên</th>'+thHead+'<th style="padding:8px 11px;color:#fff;font-size:10px;font-weight:700;text-align:center">Điểm TB</th></tr></thead><tbody>'+nvRows+'</tbody></table></div>'
    +'<div style="margin-bottom:20px"><div style="font-size:10px;font-weight:800;color:#1a3a6e;text-transform:uppercase;letter-spacing:.09em;margin-bottom:9px;padding-bottom:4px;border-bottom:2px solid #e8eef8">🚨 III. CẢNH BÁO & ĐỀ XUẤT</div>'+warnHtml2+'</div>'
    +plHtml
    +'<div style="margin-top:24px;padding-top:12px;border-top:1px solid #eee;display:flex;justify-content:space-between">'
    +'<div><div style="font-weight:700;color:#1a3a6e;font-size:11px">Nam A Bank — Phòng KHCN</div><div style="font-size:10px;color:#aaa;margin-top:1px">Tài liệu nội bộ — Không phổ biến ra ngoài</div></div>'
    +'<div style="text-align:right"><div style="font-weight:700;color:#1a3a6e;font-size:11px">'+monthLabel+' · '+scopeLabel+'</div><div style="font-size:10px;color:#aaa;margin-top:1px">KPI Banking NAB System</div></div></div>'
    +'</div></body></html>';
}
function printReport(scope) {
  closeExpModal();
  var html = buildReport(S.month, scope);
  var win = window.open('', '_blank', 'width=900,height=700');
  if (!win) { alert('Vui lòng cho phép popup để xuất báo cáo'); return; }
  win.document.write(html);
  win.document.close();
  win.onload = function() { win.focus(); setTimeout(function(){win.print();},500); };
}

// ═══════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════
function setTab(t) {
  if (t === 'kh' && !pinAuth) { openPinModal(function(){S.tab=t;S.selNV=null;render();}); return; }
  S.tab=t; S.selNV=null; S.detailNV=null; S.plFormNV=null; render();
}
function setKhTab(t) { S.khTab=t; S.selNV=null; render(); }
function setMonth(m) { S.month=m; S.selNV=null; S.detailNV=null; loadMonth(m).then(function(){render();}); }
function setT(t) { S.selT=t; render(); }
function setTKh(t) { S.selT=t; render(); }
function setScope(s) { S.scope=s; render(); }
function setScopeDay(v) { S.scopeDay=v; render(); }
function setScopeFrom(v) { S.scopeFrom=v; render(); }
function setScopeTo(v) { S.scopeTo=v; render(); }
function selNV(ma) { S.selNV=ma; render(); }
function selNVKh(ma) { S.selNV=ma; render(); }
function backNhap() { S.selNV=null; render(); }
function backKhT() { S.selNV=null; render(); }
function showDetail(ma) { S.detailNV=ma; render(); }
function backDash() { S.detailNV=null; render(); }
function clearNVFilter() { S.filterNVs=[]; render(); }
function toggleNV(ma) { var i=S.filterNVs.indexOf(ma); if(i>=0)S.filterNVs.splice(i,1);else S.filterNVs.push(ma); render(); }
function setPlTab(t) { S.plTab=t; render(); }
function plOpenNV(ma) {
  S.selNV = ma;
  S.tab = 'pl';
  render();
}
function openPlForm(ma) { S.plFormNV=ma; S.plEditId=null; render(); }
function backPl() {
  S.selNV = null;
  S.plFormNV = null;
  render();
}
function closePlForm() {
  S.plFormNV = null;
  S.plEditId = null;
  // Nếu đang ở pipeline, quay về danh sách NV
  if (S.tab === 'pl') { S.selNV = null; }
  render();
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
async function init() {
  try { await loadMonth(CUR_M); } catch(e) { console.warn(e); }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  render();
  setInterval(async function() {
    // Không refresh khi đang nhập form (có input đang focus hoặc plFormNV active)
    var activeEl = document.activeElement;
    var isTyping = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT');
    var isInForm = S.selNV || S.plFormNV;
    if (isTyping || isInForm) return;
    await loadMonth(S.month);
    render();
  }, 20000);
}
init();
