<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KPI Banking — NAB</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg0:#050d1a;--bg1:#0a1628;--bg2:#111f35;--bg3:#1a2e48;
  --gold:#f59e0b;--blue:#3b82f6;--green:#10b981;--red:#ef4444;
  --purple:#8b5cf6;--cyan:#06b6d4;--pink:#ec4899;--orange:#f97316;
  --text:#e2e8f0;--dim:#94a3b8;--mute:#475569;--border:#1e3a5f;
}
html,body{background:var(--bg0);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg0);padding-bottom:70px;}

/* Header */
.header{background:linear-gradient(180deg,var(--bg1),var(--bg0));padding:14px 16px 12px;
  border-bottom:1px solid #1e3a5f55;position:sticky;top:0;z-index:100;}
.header-row{display:flex;align-items:center;justify-content:space-between;}
.header-title{font-size:20px;font-weight:900;letter-spacing:-.02em;}
.header-title span{color:var(--gold);}
.header-sub{font-size:11px;color:var(--mute);margin-top:2px;display:flex;align-items:center;gap:6px;}
.badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;}
.badge-green{background:#10b98122;color:var(--green);border:1px solid #10b98144;}
.badge-yellow{background:#f59e0b22;color:var(--gold);border:1px solid #f59e0b44;}
.badge-red{background:#ef444422;color:var(--red);border:1px solid #ef444444;}

/* Bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;background:var(--bg0);
  border-top:1px solid #1e3a5f55;display:flex;z-index:100;}
.nav-btn{flex:1;padding:10px 6px;background:none;border:none;cursor:pointer;
  color:var(--mute);font-size:10px;font-weight:500;font-family:inherit;
  border-top:2px solid transparent;transition:all .2s;line-height:1.4;}
.nav-btn.active{color:var(--gold);border-top-color:var(--gold);font-weight:700;}
.nav-icon{font-size:19px;display:block;margin-bottom:1px;}

/* Cards */
.card{background:var(--bg2);border-radius:14px;padding:14px;
  border:1px solid #1e3a5f22;margin-bottom:10px;}
.card-highlight{background:linear-gradient(135deg,#1a3050,var(--bg1));
  border:1px solid #1e3a5f44;}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.kpi-card{background:var(--bg2);border-radius:14px;padding:13px;
  border:1px solid #1e3a5f22;position:relative;overflow:hidden;}
.kpi-card-bg{position:absolute;bottom:-8px;right:-4px;font-size:38px;opacity:.04;}
.kpi-label{font-size:10px;color:var(--mute);margin-bottom:2px;}
.kpi-value{font-size:20px;font-weight:900;line-height:1;}
.kpi-kh{font-size:9px;color:var(--mute);margin-top:2px;}
.kpi-ring-wrap{position:relative;width:44px;height:44px;flex-shrink:0;}
.kpi-ring-pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:9px;font-weight:700;text-align:center;}

/* Progress bar */
.bar-wrap{background:#0a1628;border-radius:4px;height:5px;overflow:hidden;margin-top:6px;}
.bar-fill{height:100%;border-radius:4px;transition:width .5s ease;}

/* Section title */
.sec-title{font-size:11px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.1em;font-weight:700;margin-bottom:10px;}

/* NV list items */
.nv-item{background:var(--bg2);border-radius:14px;padding:13px 14px;
  margin-bottom:8px;border:1px solid #1e3a5f22;cursor:pointer;
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;}
.nv-item:active{opacity:.7;}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:800;flex-shrink:0;}
.nv-name{font-weight:600;font-size:13px;color:var(--text);}
.nv-sub{font-size:11px;color:var(--mute);margin-top:2px;}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
.chip{font-size:10px;padding:2px 6px;border-radius:5px;font-weight:700;}

/* Form */
.form-field{background:var(--bg2);border-radius:14px;padding:14px;
  margin-bottom:10px;border:1px solid #1e3a5f22;}
.field-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.field-label{display:flex;align-items:center;gap:8px;}
.field-name{font-weight:600;font-size:14px;}
.field-kh{font-size:10px;color:var(--mute);}
input[type=number]{width:100%;background:var(--bg1);border:1px solid var(--border);
  border-radius:10px;padding:12px 13px;color:var(--text);font-size:16px;
  font-weight:600;outline:none;font-family:inherit;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]:focus{border-color:#3b82f6;}

/* Buttons */
.btn-primary{width:100%;padding:15px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--gold),#d97706);color:#040a12;
  font-weight:800;font-size:16px;font-family:inherit;margin-top:4px;}
.btn-primary:active{opacity:.8;}
.btn-primary.saved{background:#10b981;color:#fff;}
.btn-back{background:none;border:none;color:var(--dim);cursor:pointer;
  font-size:13px;font-family:inherit;padding:0;margin-bottom:14px;}

/* Ranking */
.rank-item{background:var(--bg2);border-radius:14px;padding:13px 14px;
  margin-bottom:8px;border:1px solid #1e3a5f22;cursor:pointer;
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;}
.rank-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}

/* Tuần tabs */
.tabs{display:flex;gap:6px;margin-bottom:14px;}
.tab-btn{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--border);
  background:var(--bg2);color:var(--dim);font-weight:700;font-size:14px;
  cursor:pointer;font-family:inherit;transition:all .2s;}
.tab-btn.active{border-color:#3b82f6;background:#3b82f622;color:#3b82f6;}

/* Loading */
#loading{display:flex;align-items:center;justify-content:center;height:100vh;
  flex-direction:column;gap:16px;}

/* Alert */
.alert-card{background:var(--bg2);border-radius:14px;padding:14px;
  margin-bottom:12px;border-left:4px solid;}
.alert-title{font-size:14px;font-weight:700;margin-bottom:8px;}
.alert-item{display:flex;align-items:center;gap:8px;padding:7px 0;
  border-top:1px solid #ffffff08;font-size:13px;}

/* Scope filter */
.scope-bar{display:flex;gap:5px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;}
.scope-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--border);
  background:var(--bg2);color:var(--dim);font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;white-space:nowrap;}
.scope-btn.active{border-color:var(--gold);background:#f59e0b22;color:var(--gold);}
</style>
</head>
<body>
<div id="loading">
  <div style="font-size:40px">🏦</div>
  <div style="color:#f59e0b;font-size:16px;font-weight:700">KPI Banking NAB</div>
  <div style="color:#64748b;font-size:13px">Đang tải...</div>
</div>
<div id="app" style="display:none"></div>

<script>
// ══════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════
const DB = "https://kpi-banking-nab-default-rtdb.asia-southeast1.firebasedatabase.app";
const ROOT = "kpi";
const MONTH = (()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); })();
const TODAY_DAY = new Date().getDate();
const CUR_TUAN = TODAY_DAY<=7?"T1":TODAY_DAY<=14?"T2":TODAY_DAY<=21?"T3":"T4";

const NVS = [
  {ma:"10924",ten:"TRƯƠNG ANH TOÀN"},
  {ma:"16032",ten:"DƯƠNG HỒNG PHÁP"},
  {ma:"10847",ten:"TRẦN VIẾT DUY"},
  {ma:"10852",ten:"ĐỖ THỊ HỒNG SƯƠNG"},
  {ma:"13933",ten:"VÕ UYÊN BÌNH"},
  {ma:"15642",ten:"TRẦN CÔNG LUẬT"},
  {ma:"17339",ten:"PHẠM THỊ NGỌC HUYỀN"},
  {ma:"17489",ten:"NGUYỄN LÂM KHA"},
  {ma:"NV009",ten:"NGUYỄN THÀNH ĐẠT"},
  {ma:"NV010",ten:"ĐẶNG VÕ DUYÊN TRINH"},
  {ma:"NV011",ten:"LÊ THỊ BÍCH PHƯỢNG"},
  {ma:"NV012",ten:"NGUYỄN HỒNG PHƯƠNG THANH"},
];

const KPIS = [
  {key:"huy_dong",label:"Huy Động",icon:"💰",unit:"tr đ",star:true, color:"#f59e0b"},
  {key:"du_no",   label:"Dư Nợ",   icon:"🏦",unit:"tr đ",star:true, color:"#3b82f6"},
  {key:"the_td",  label:"Thẻ TD",  icon:"💳",unit:"thẻ", star:true, color:"#8b5cf6"},
  {key:"tk_hkd",  label:"TK HKD",  icon:"🏢",unit:"TK",  star:false,color:"#10b981"},
  {key:"qr_code", label:"QR Code", icon:"📱",unit:"QR",  star:false,color:"#06b6d4"},
  {key:"cif",     label:"CIF",     icon:"👤",unit:"CIF", star:false,color:"#ec4899"},
];

const DEFAULT_KH = {huy_dong:47900,du_no:31000,the_td:82,tk_hkd:80,qr_code:220,cif:415};

// ══════════════════════════════════════════
// FIREBASE REST
// ══════════════════════════════════════════
async function fbGet(path) {
  try {
    const r = await fetch(DB+"/"+ROOT+"/"+path+".json");
    if(!r.ok) return null;
    const d = await r.json();
    return d;
  } catch(e) { console.warn("GET",path,e.message); return null; }
}

async function fbSet(path, data) {
  try {
    await fetch(DB+"/"+ROOT+"/"+path+".json", {
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });
  } catch(e) { console.warn("SET",path,e.message); }
}

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let STATE = {
  tab: "nhap",           // nhap | kh | dash | alert
  khTab: "phong",        // phong | tuan
  selTuan: CUR_TUAN,
  selNV: null,
  detailNV: null,
  khPhong: {},           // {kpi: value}
  khTuan: {},            // {tuan: {ma: {kpi: value}}}
  thTuan: {},            // {tuan: {ma: {kpi: value, updatedAt}}}
  scope: "thang",        // thang | T1..T4
  online: false,
};

function getKhPhong() { return STATE.khPhong[MONTH] || DEFAULT_KH; }
function getKhTuan(tuan, ma) { return (STATE.khTuan[MONTH]||{})[tuan]?.[ma] || {}; }
function getThTuan(tuan, ma) { return (STATE.thTuan[MONTH]||{})[tuan]?.[ma] || {}; }

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function fmt(v, unit="") {
  if(v===null||v===undefined) return "—";
  const n = Number(v);
  if(isNaN(n)) return "—";
  return n.toLocaleString("vi-VN")+(unit?" "+unit:"");
}
function pct(th, kh) { return (kh&&kh>0&&th!==null&&th!==undefined) ? th/kh*100 : null; }
function p2s(p) { return p===null?"—":Math.round(p)+"%"; }
function pc(p) {
  if(p===null) return "#475569";
  if(p>=100) return "#10b981";
  if(p>=70)  return "#f59e0b";
  if(p>=40)  return "#f97316";
  return "#ef4444";
}
function acColor(ma) {
  const cols=["#f59e0b","#3b82f6","#8b5cf6","#10b981","#ec4899","#06b6d4","#f97316","#a855f7"];
  let h=0; for(let i=0;i<ma.length;i++) h=(h*31+ma.charCodeAt(i))%cols.length;
  return cols[h];
}
function ring(p, size=44, sw=6) {
  const r=(size-sw*2)/2, c=2*Math.PI*r, val=Math.min(Math.max(p||0,0),100);
  const color=pc(p);
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#08111e" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${val/100*c} ${c}" stroke-linecap="round"/>
  </svg>`;
}
function bar(v, max, color, h=5) {
  const w = max>0?Math.min(100,Math.max(0,(v||0)/max*100)):0;
  return `<div class="bar-wrap"><div class="bar-fill" style="width:${w}%;background:${color};height:${h}px"></div></div>`;
}
function avatar(name, ma, size=38) {
  const c=acColor(ma);
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${c}1a;border:1.5px solid ${c}55;color:${c};font-size:${size*.38}px">
    ${name.split(" ").pop()[0]||"?"}
  </div>`;
}
function chip(label, color) {
  return `<span class="chip" style="background:${color}22;color:${color}">${label}</span>`;
}
function fmtTs(ts) {
  if(!ts) return "";
  const d=new Date(ts);
  return `${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

// ══════════════════════════════════════════
// LOAD DATA
// ══════════════════════════════════════════
async function loadData() {
  const [kp, kt, th] = await Promise.all([
    fbGet("khPhong/"+MONTH),
    fbGet("khTuan/"+MONTH),
    fbGet("thTuan/"+MONTH),
  ]);
  if(kp) STATE.khPhong[MONTH] = kp;
  if(kt) STATE.khTuan[MONTH]  = kt;
  if(th) STATE.thTuan[MONTH]  = th;
  STATE.online = !!(kp||kt||th);
}

// ══════════════════════════════════════════
// RENDER ENGINE
// ══════════════════════════════════════════
function render() {
  const app = document.getElementById("app");
  if(!app) return;
  app.innerHTML = renderHeader() + renderContent() + renderNav();
  bindEvents();
}

function renderHeader() {
  const onlineBadge = STATE.online
    ? `<span class="badge badge-green">☁️ Online</span>`
    : `<span class="badge badge-yellow">📱 Offline</span>`;
  const khTabs = STATE.tab==="kh" ? `
    <div style="display:flex;gap:5px">
      <button onclick="setKhTab('phong')" class="scope-btn ${STATE.khTab==='phong'?'active':''}" style="padding:5px 10px;font-size:11px">📋 Phòng</button>
      <button onclick="setKhTab('tuan')" class="scope-btn ${STATE.khTab==='tuan'?'active':''}" style="padding:5px 10px;font-size:11px">👤 NV</button>
    </div>` : "";
  return `<div class="header">
    <div class="header-row">
      <div>
        <div class="header-title">🏦 KPI <span>Banking</span></div>
        <div class="header-sub">
          ${new Date().toLocaleDateString("vi-VN",{weekday:"short",day:"numeric",month:"numeric"})}
          · <b style="color:var(--gold)">${MONTH}</b>
          · <b style="color:#3b82f6">${CUR_TUAN}</b>
          · ${onlineBadge}
        </div>
      </div>
      ${khTabs}
    </div>
  </div>`;
}

function renderNav() {
  const alertCount = NVS.filter(nv=>{
    const kh = getKhTuan(CUR_TUAN, nv.ma);
    const th = getThTuan(CUR_TUAN, nv.ma);
    return KPIS.some(k=>(kh[k.key]||0)>0) && !KPIS.some(k=>(th[k.key]??null)!==null);
  }).length;
  const tabs = [
    {id:"nhap", icon:"✏️", label:"Nhập TH"},
    {id:"kh",   icon:"🎯", label:"Giao KH"},
    {id:"dash", icon:"📊", label:"Dashboard"},
    {id:"alert",icon:"🚨", label:"Cảnh báo"},
  ];
  return `<div class="nav">${tabs.map(t=>`
    <button class="nav-btn ${STATE.tab===t.id?'active':''}" onclick="setTab('${t.id}')">
      <span class="nav-icon">${t.icon}</span>
      ${t.id==="alert"&&alertCount>0
        ? `<span style="position:relative">${t.label}<span style="position:absolute;top:-8px;right:-10px;background:#ef4444;color:#fff;border-radius:50%;width:14px;height:14px;font-size:9px;display:inline-flex;align-items:center;justify-content:center">${alertCount}</span></span>`
        : t.label}
    </button>`).join("")}</div>`;
}

function renderContent() {
  if(STATE.tab==="nhap")  return renderNhap();
  if(STATE.tab==="kh")    return STATE.khTab==="phong" ? renderKhPhong() : renderKhTuan();
  if(STATE.tab==="dash")  return renderDash();
  if(STATE.tab==="alert") return renderAlert();
  return "";
}

// ── NHẬP TH ──────────────────────────────
function renderNhap() {
  if(STATE.selNV) return renderNhapForm();
  return `<div style="padding:16px">
    <div class="sec-title">✏️ Nhập / Cập nhật TH · ${MONTH}</div>
    <div class="tabs">${["T1","T2","T3","T4"].map(t=>`
      <button class="tab-btn ${STATE.selTuan===t?'active':''}" onclick="setTuan('${t}')">${t}</button>
    `).join("")}</div>
    <div>
    ${NVS.map(nv=>{
      const th = getThTuan(STATE.selTuan, nv.ma);
      const kh = getKhTuan(STATE.selTuan, nv.ma);
      const hasKh = KPIS.some(k=>(kh[k.key]||0)>0);
      const hasTh = KPIS.some(k=>(th[k.key]??null)!==null);
      const ts = th.updatedAt;
      let sub = "";
      if(hasTh) {
        const parts = KPIS.filter(k=>k.star).map(k=>{
          const v=th[k.key]; const kv=kh[k.key]||0;
          const p=kv>0?pct(v,kv):null;
          return `${k.icon} ${fmt(v,k.unit)}${p!==null?" ("+Math.round(p)+"%)":""}`;
        });
        sub = `<div class="chips">${parts.map(s=>`<span style="font-size:10px;color:var(--dim)">${s}</span>`).join("")}</div>`;
        if(ts) sub += `<div style="font-size:10px;color:var(--mute);margin-top:3px">🕐 ${fmtTs(ts)}</div>`;
      } else {
        sub = `<div class="nv-sub">${hasKh?"Có KH — chưa nhập TH":"Chưa có KH tuần này"}</div>`;
      }
      return `<button class="nv-item" onclick="selNV('${nv.ma}')">
        ${avatar(nv.ten, nv.ma)}
        <div style="flex:1">
          <div class="nv-name">${nv.ten}</div>
          ${sub}
        </div>
        ${hasTh ? chip("Đã nhập","#10b981") : hasKh ? chip("Cần nhập","#f59e0b") : chip("Chưa KH","#475569")}
      </button>`;
    }).join("")}
    </div>
  </div>`;
}

function renderNhapForm() {
  const nv = NVS.find(n=>n.ma===STATE.selNV);
  if(!nv) return "";
  const kh = getKhTuan(STATE.selTuan, nv.ma);
  const th = getThTuan(STATE.selTuan, nv.ma);
  const hasKh = KPIS.some(k=>(kh[k.key]||0)>0);
  const fields = KPIS.map(k=>{
    const khv = kh[k.key]||0;
    const thv = th[k.key]??null;
    const p = khv>0&&thv!==null ? pct(thv,khv) : null;
    return `<div class="form-field" style="border-color:${k.color}33">
      <div class="field-header">
        <div class="field-label">
          <span style="font-size:20px">${k.icon}</span>
          <div>
            <div class="field-name" style="color:${k.star?"#f59e0b":"var(--text)"}">${k.star?"⭐ ":""}${k.label}</div>
            <div class="field-kh">KH ${STATE.selTuan}: ${khv?fmt(khv,k.unit):"Chưa giao"}</div>
          </div>
        </div>
        <span style="font-size:11px;font-weight:700;color:${pc(p)}">${p2s(p)}</span>
      </div>
      <input type="number" id="f_${k.key}" value="${thv!==null?thv:""}" placeholder="${k.label} (${k.unit})"
        style="border-color:${k.color}44" oninput="updateFieldBar('${k.key}',${khv},'${k.color}')">
      <div id="bar_${k.key}" style="margin-top:6px">${p!==null&&khv>0?bar(thv,khv,k.color):""}</div>
    </div>`;
  }).join("");
  return `<div style="padding:16px">
    <button class="btn-back" onclick="backNhap()">← Chọn lại NV</button>
    <div class="card card-highlight" style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:12px">
        ${avatar(nv.ten, nv.ma, 46)}
        <div>
          <div style="font-weight:700;font-size:15px">${nv.ten}</div>
          <div style="font-size:11px;color:var(--dim);margin-top:3px">
            📅 ${STATE.selTuan} · ${MONTH}
            ${!hasKh?'<span style="color:#ef4444;margin-left:6px">⚠️ Chưa có KH</span>':""}
          </div>
        </div>
      </div>
    </div>
    ${fields}
    <button class="btn-primary" id="save-btn" onclick="saveTH()">💾 LƯU TH ${STATE.selTuan}</button>
  </div>`;
}

function updateFieldBar(key, khv, color) {
  const inp = document.getElementById("f_"+key);
  const barEl = document.getElementById("bar_"+key);
  if(!inp||!barEl) return;

    </div>

    ${NVS.map(nv=>{

      const hasKh = KPIS.some(k=>(nvKh[k.key]||0)>0);

          <div class="nv-name">${nv.ten}</div>
          ${hasKh
            ? `<div class="chips">${KPIS.filter(k=>k.star).map(k=>chip(k.icon+" "+fmt(nvKh[k.key]||0,k.unit),k.color)).join("")}</div>`

      </button>`;

function renderKhTuanForm() {
  const nv = NVS.find(n=>n.ma===STATE.selNV);
  if(!nv) return "";
  const tuan = STATE.selTuan;
  const khP = getKhPhong();
  const cur = getKhTuan(tuan, nv.ma);
  function sumGiaoPhong(kkey) {
    return NVS.reduce((s,nv2)=>
      s+["T1","T2","T3","T4"].reduce((s2,t)=>s2+((STATE.khTuan[MONTH]||{})[t]?.[nv2.ma]?.[kkey]||0),0),0);
  }
  const fields = KPIS.map(k=>{
    const old = cur[k.key]||0;
    const giaoExcl = sumGiaoPhong(k.key) - ["T1","T2","T3","T4"].reduce((s,t)=>s+((STATE.khTuan[MONTH]||{})[t]?.[nv.ma]?.[k.key]||0),0);
    const nvExcl = ["T1","T2","T3","T4"].reduce((s,t)=>s+((STATE.khTuan[MONTH]||{})[t]?.[nv.ma]?.[k.key]||0),0) - old;
    const con = (khP[k.key]||0) - giaoExcl - nvExcl;
    return `<div class="form-field" style="border-color:${k.color}33">
      <div class="field-header">
        <div class="field-label">
          <span style="font-size:20px">${k.icon}</span>

            <div class="field-name" style="color:${k.star?"#f59e0b":"var(--text)"}">${k.label}</div>

          </div>
        </div>
      </div>
      <input type="number" id="kt_${k.key}" value="${old||""}" placeholder="KH ${tuan} — ${k.label} (${k.unit})">

  }).join("");
  return `<div style="padding:16px">
    <button class="btn-back" onclick="backKhTuan()">← Danh sách NV</button>
    <div class="card card-highlight" style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:12px">

        <div>
          <div style="font-weight:700;font-size:15px">${nv.ten}</div>
          <div style="font-size:11px;color:var(--dim)">Giao KH ${tuan} · ${MONTH}</div>
        </div>
      </div>
    </div>
    ${fields}
    <button class="btn-primary" id="kt-btn" onclick="saveKhTuan()">💾 GIAO KẾ HOẠCH</button>
  </div>`;
}

// ── DASHBOARD ──────────────────────────────
function renderDash() {
  if(STATE.detailNV) return renderDashDetail();
  const scope = STATE.scope;
  const month = MONTH;
  const tuans = scope==="thang"?["T1","T2","T3","T4"]:[scope];
  const khP = scope==="thang" ? getKhPhong() : (() => {
    const o={};
    KPIS.forEach(k=>{o[k.key]=NVS.reduce((s,nv)=>s+getKhTuan(scope,nv.ma)[k.key]||0,0);});
    return o;
  })();

  // Total TH
  const totalTH={};
  KPIS.forEach(k=>{
    totalTH[k.key]=NVS.reduce((s,nv)=>
      tuans.reduce((s2,t)=>s2+((STATE.thTuan[MONTH]||{})[t]?.[nv.ma]?.[k.key]||0),s),0);
  });

  // Per NV score
  const nvScores = NVS.map(nv=>{
    const starKpis = KPIS.filter(k=>k.star);
    const scores = starKpis.map(k=>{
      const kh = tuans.reduce((s,t)=>s+(getKhTuan(t,nv.ma)[k.key]||0),0);
      const th = tuans.reduce((s,t)=>s+((STATE.thTuan[MONTH]||{})[t]?.[nv.ma]?.[k.key]||0),0);
      return kh>0 ? pct(th,kh) : null;
    }).filter(p=>p!==null);
    const score = scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : null;
    return {...nv, score};
  }).sort((a,b)=>{
    if(a.score===null&&b.score===null) return 0;
    if(a.score===null) return 1;
    if(b.score===null) return -1;
    return b.score-a.score;
  });

  const kpiCards = KPIS.map(k=>{
    const th=totalTH[k.key]||0, kh=khP[k.key]||0;
    const p=pct(th,kh);
    return `<div class="kpi-card" style="border-color:${k.color}33">
      <div class="kpi-card-bg">${k.icon}</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <div>
          <div class="kpi-label">${k.icon} ${k.label}</div>
          <div class="kpi-value" style="color:${kh>0?k.color:"var(--mute)"}">${fmt(th,k.unit)}</div>
          <div class="kpi-kh">KH: ${kh>0?fmt(kh,k.unit):"Chưa có"}</div>
        </div>
        <div style="position:relative;width:44px;height:44px">
          ${ring(p||0)}
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:9px;font-weight:700;color:${pc(p)}">${kh>0?p2s(p):"—"}</div>
        </div>
      </div>
      ${kh>0?bar(th,kh,k.color):""}
    </div>`;
  }).join("");

  const rankList = nvScores.map((nv,i)=>{
    const rankColors=["#f59e0b22","#94a3b822","#d9770622"];
    const rankTextColors=["#f59e0b","#94a3b8","#d97706"];
    const hasSc = nv.score!==null;
    const thLabel = KPIS.filter(k=>k.star).map(k=>{
      const kh=tuans.reduce((s,t)=>s+(getKhTuan(t,nv.ma)[k.key]||0),0);
      const th=tuans.reduce((s,t)=>s+((STATE.thTuan[MONTH]||{})[t]?.[nv.ma]?.[k.key]||0),0);
      const p=kh>0?pct(th,kh):null;
      return `${k.icon} ${fmt(th,k.unit)}${p!==null?" ("+Math.round(p)+"%)":""}`;
    }).join(" · ");
    return `<button class="rank-item" onclick="showDetail('${nv.ma}')">
      <div class="rank-num" style="background:${rankColors[i]||"var(--bg1)"};color:${rankTextColors[i]||"var(--mute)"}">${i+1}</div>
      ${avatar(nv.ten,nv.ma,36)}
      <div style="flex:1;overflow:hidden">
        <div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${nv.ten}</div>
        <div style="font-size:10px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${thLabel}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:18px;font-weight:800;color:${pc(hasSc?nv.score:null)}">${hasSc?p2s(nv.score):"—"}</div>
        <div style="font-size:10px;color:${pc(hasSc?nv.score:null)}">${hasSc?(nv.score>=100?"✅ Đạt":nv.score>=70?"⚡ Khá":nv.score>=40?"⚠️ TB":"🚨 Cần đẩy"):"Chưa có KH"}</div>
      </div>
    </button>`;
  }).join("");

  return `<div style="padding:14px 16px 0">
    <div class="scope-bar">
      ${[{k:"thang",l:"📅 Cả tháng"},
         {k:"T1",l:"T1"},{k:"T2",l:"T2"},{k:"T3",l:"T3"},{k:"T4",l:"T4"}]
        .map(s=>`<button class="scope-btn ${STATE.scope===s.k?'active':''}" onclick="setScope('${s.k}')">${s.l}</button>`)
        .join("")}
    </div>
  </div>
  <div style="padding:0 16px">
    <div class="sec-title">Tổng hợp · ${scope==="thang"?"Cả tháng":scope}</div>
    <div class="kpi-grid">${kpiCards}</div>
    <div class="sec-title">🏆 Xếp hạng</div>
    ${rankList}
  </div>`;
}

function renderDashDetail() {
  const nv = NVS.find(n=>n.ma===STATE.detailNV);
  if(!nv) return "";
  const tuans = STATE.scope==="thang"?["T1","T2","T3","T4"]:[STATE.scope];
  const kpiRows = KPIS.map(k=>{
    const kh=tuans.reduce((s,t)=>s+(getKhTuan(t,nv.ma)[k.key]||0),0);
    const th=tuans.reduce((s,t)=>s+((STATE.thTuan[MONTH]||{})[t]?.[nv.ma]?.[k.key]||0),0);
    const p=kh>0?pct(th,kh):null;
    return `<div class="card" style="border-color:${kh>0?k.color+"44":"#1e3a5f22"}">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:${kh>0?'8px':'0'}">
        <span style="font-size:20px">${k.icon}</span>
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px;color:${k.star?"#f59e0b":"var(--text)"}">${k.label}</div>
          <div style="font-size:10px;color:var(--mute)">KH: ${kh?fmt(kh,k.unit):"Chưa giao"}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:18px;font-weight:800;color:${kh>0?k.color:"var(--mute)"}">${fmt(th,k.unit)}</div>
          <span style="font-size:10px;font-weight:700;color:${pc(p)}">${p2s(p)}</span>
        </div>
      </div>
      ${kh>0?bar(th,kh,k.color):""}
    </div>`;
  }).join("");

  const histRows = ["T1","T2","T3","T4"].map(t=>{
    const kh=getKhTuan(t,nv.ma); const th=getThTuan(t,nv.ma);
    const hasKh=KPIS.some(k=>(kh[k.key]||0)>0);
    const hasTh=KPIS.some(k=>(th[k.key]??null)!==null);
    if(!hasKh&&!hasTh) return "";
    return `<div style="background:var(--bg1);border-radius:10px;padding:10px 12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="background:#3b82f622;color:#3b82f6;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">${t}</span>
        ${th.updatedAt?`<span style="font-size:10px;color:var(--mute)">🕐 ${fmtTs(th.updatedAt)}</span>`:""}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
        ${KPIS.filter(k=>k.star).map(k=>{
          const khv=kh[k.key]||0, thv=th[k.key]??null;
          const p=khv>0?pct(thv??0,khv):null;
          return `<div style="background:var(--bg2);border-radius:8px;padding:7px;text-align:center">
            <div style="font-size:10px;color:${k.color}">${k.icon}</div>
            <div style="font-size:12px;font-weight:700;color:${khv>0?pc(p):"var(--mute)"}">${khv>0?fmt(thv??0,k.unit):"—"}</div>
            <div style="font-size:9px;color:var(--mute)">KH:${fmt(khv,k.unit)}</div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }).join("");

  return `<div style="padding:16px">
    <button class="btn-back" onclick="backDash()">← Dashboard</button>
    <div class="card card-highlight" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:12px">
        ${avatar(nv.ten,nv.ma,50)}
        <div style="flex:1"><div style="font-weight:800;font-size:15px">${nv.ten}</div></div>
      </div>
    </div>
    <div class="sec-title">KPI theo scope</div>
    ${kpiRows}
    <div class="sec-title" style="margin-top:8px">Chi tiết từng tuần</div>
    ${histRows||"<div style='color:var(--mute);text-align:center;padding:16px'>Chưa có dữ liệu</div>"}
  </div>`;
}

// ── CẢNH BÁO ──────────────────────────────
function renderAlert() {
  const khP = getKhPhong();
  const chuaCoKh = NVS.filter(nv=>!KPIS.some(k=>(getKhTuan(CUR_TUAN,nv.ma)[k.key]||0)>0));
  const chuaNhap = NVS.filter(nv=>{
    const kh=getKhTuan(CUR_TUAN,nv.ma), th=getThTuan(CUR_TUAN,nv.ma);
    return KPIS.some(k=>(kh[k.key]||0)>0) && !KPIS.some(k=>(th[k.key]??null)!==null);
  });
  const totalTH={};
  KPIS.forEach(k=>{
    totalTH[k.key]=NVS.reduce((s,nv)=>
      ["T1","T2","T3","T4"].reduce((s2,t)=>s2+((STATE.thTuan[MONTH]||{})[t]?.[nv.ma]?.[k.key]||0),s),0);
  });
  const kpiWarn = KPIS.map(k=>({...k,th:totalTH[k.key]||0,p:pct(totalTH[k.key],khP[k.key])}))
    .filter(k=>k.p!==null&&k.p<70);

  return `<div style="padding:16px">
    <div class="alert-card" style="border-color:${chuaNhap.length?"#ef4444":"#10b981"}">
      <div class="alert-title" style="color:${chuaNhap.length?"#ef4444":"#10b981"}">
        ${chuaNhap.length?`🚨 ${chuaNhap.length} NV có KH chưa nhập TH (${CUR_TUAN})`:"✅ Tất cả NV đã nhập TH"}
      </div>
      ${chuaNhap.map(nv=>`<div class="alert-item">
        ${avatar(nv.ten,nv.ma,30)} <span>${nv.ten}</span>
      </div>`).join("")}
    </div>

    ${chuaCoKh.length?`<div class="alert-card" style="border-color:#f59e0b">
      <div class="alert-title" style="color:#f59e0b">⚠️ ${chuaCoKh.length} NV chưa được giao KH ${CUR_TUAN}</div>
      ${chuaCoKh.map(nv=>`<div class="alert-item">
        ${avatar(nv.ten,nv.ma,30)} <span>${nv.ten}</span>
      </div>`).join("")}
    </div>`:""}

    ${kpiWarn.length?`<div class="sec-title" style="margin-top:4px">KPI dưới 70%</div>
    ${kpiWarn.map(k=>`<div class="card" style="margin-bottom:10px;border-color:#ef444433">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="font-size:22px">${k.icon}</span>
        <div style="flex:1">
          <div style="font-weight:700;font-size:14px;color:${k.star?"#f59e0b":"var(--text)"}">${k.label}</div>
          <div style="font-size:11px;color:var(--mute)">TH: ${fmt(k.th,k.unit)} / KH: ${fmt(khP[k.key],k.unit)}</div>
        </div>
        <span style="font-size:16px;font-weight:800;color:${pc(k.p)}">${p2s(k.p)}</span>
      </div>
      ${bar(k.th,khP[k.key],pc(k.p),6)}
    </div>`).join("")}`:"<div class='sec-title' style='margin-top:4px;color:#10b981'>✅ Tất cả KPI đang trên 70%</div>"}
  </div>`;
}

  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";

  // Realtime: poll mỗi 15 giây
  setInterval(async ()=>{

    render();
